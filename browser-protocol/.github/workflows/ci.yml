name: Shared recording contract
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# D66: a PR push runs once, and a newer push to the same PR cancels its superseded run.
# Pushes to main each get their own group: GitHub would otherwise drop a pending main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  launcher-paths:
    # Light gate for launcher-macos: did this change touch the launcher, the relay, their
    # tests, what those tests import or read, the capture graph (D68.1), or this workflow?
    # Unknown base: run it.
    # A light job: a constant GitHub-hosted label (the CM_RUNNER selector stays the contract job's).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          paths='^(scenarios/(native-launcher|control-relay|live-folder|folder-clock|product-topologies)\.mjs|tests/(live-folder-driver|control-relay)\.test\.mjs|conformance/multistream/corpus\.json|\.github/workflows/ci\.yml|extension/(capture|pcm-worklet)\.js|tests/capture-real-time\.mjs|package(-lock)?\.json)$|^conformance/live-folder/'
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then changed=true
          elif git diff --name-only "$BASE" HEAD | grep -qE "$paths"; then changed=true
          else changed=false; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "launcher-macos needed: $changed (base ${BASE:-none})"
  launcher-macos:
    # The launcher and relay read process identity differently on macOS (no /proc:
    # KERN_PROCARGS2 through python3), so their tests run there too, when launcher-paths says so.
    # Same bound as the contract job, which runs these tests on Linux. D68.1: the capture clock
    # check runs here too, because hosted macOS is where a suspended capture context falls behind.
    needs: launcher-paths
    if: needs.launcher-paths.outputs.changed == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Live-folder driver and control relay unit tests on macOS
        run: node --test tests/live-folder-driver.test.mjs tests/control-relay.test.mjs
      - name: A capture over 30 s keeps real time (D68.1)
        run: |
          npm ci
          npx playwright install chromium
          node tests/capture-real-time.mjs
  contract:
    # CM_RUNNER=hetzner moves the job to the cm-hetzner runners; any other value keeps ubuntu-24.04.
    runs-on: ${{ vars.CM_RUNNER == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-24.04' }}
    # p95 3.2 min over 178 green runs (2026-10-29..11-04), slowest 6.1 min: 10 min is about 3x p95.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 refresh-hashes.py && git diff --exit-code -- SHA256SUMS
      - run: python3 verify.py
      - run: python3 -m pip install -r requirements-test.txt
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: python3 conformance/check-native-fixture.py
      - run: python3 conformance/check-session-events.py
      - name: Shared scenario modules parse; live-folder driver and control relay unit tests
        run: |
          for file in scenarios/*.mjs tests/*.mjs; do node --check "$file"; done
          node --test tests/live-folder-driver.test.mjs tests/control-relay.test.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Isolated output device for generated tab tone
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio xvfb xauth
          private=$(mktemp -d /tmp/cassini-audio-ci-XXXXXXXX)
          mkdir -m 700 "$private/daemon"
          cat > "$private/server.pa" <<EOF
          load-module module-native-protocol-unix socket=$private/pulse.sock auth-anonymous=1
          load-module module-null-sink sink_name=cassini_ci rate=48000 channels=2
          set-default-sink cassini_ci
          set-default-source cassini_ci.monitor
          EOF
          PULSE_RUNTIME_PATH="$private/daemon" pulseaudio -n --daemonize --exit-idle-time=-1 --file="$private/server.pa" --log-target="file:$private/server.log"
          for _ in $(seq 1 100); do [ -S "$private/pulse.sock" ] && break; sleep .1; done
          test -S "$private/pulse.sock"
          echo "CASSINI_ISOLATED_AUDIO=1" >> "$GITHUB_ENV"
          echo "PULSE_SERVER=unix:$private/pulse.sock" >> "$GITHUB_ENV"
      - run: npm test
      - name: Real toolbar popup keeps its intended width
        run: |
          xvfb-run -a env POPUP_HEADED=1 node tests/popup-toolbar.mjs
          xvfb-run -a env POPUP_HEADED=1 POPUP_ZOOM=3 node tests/popup-toolbar.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: topology-results
          path: artifacts/
  nextcloud-talk:
    name: Real Nextcloud Talk and separate browser audio
    needs: contract
    # This stack owns host-network signaling ports; use a disposable VM rather
    # than sharing them with persistent developer/self-hosted stacks.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PROJECT_NAME: cassini-extension-nextcloud
      CASSINI_COMPAT_FIXTURE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          path: protocol
      - name: Checkout the pinned Talk harness
        uses: actions/checkout@v5
        with:
          repository: codemyriad/gocassini
          ref: 1111155cb0017b47c072a8662c54f28ad7c44223
          path: talk-harness
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: talk-harness/cassini-go-recorder/go.mod
          cache-dependency-path: talk-harness/cassini-go-recorder/go.sum
      - name: Install the browser
        working-directory: protocol
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start a locked Nextcloud 34 and Talk 24 stack
        run: |
          set -euo pipefail
          python3 talk-harness/scripts/nextcloud_compatibility.py prepare --baseline nc34 --out "$RUNNER_TEMP/nextcloud-lock"
          source "$RUNNER_TEMP/nextcloud-lock/env.sh"
          timeout 900 talk-harness/bin/cassini dev stack up --services full --recording-backend none --cassini none --debug-skip-storage-scaffold --reset
          # Cassini mode none skips AppAPI setup; verify/enable its locked bundled bytes
          # explicitly so the stack observation validates every locked app.
          python3 talk-harness/scripts/nextcloud_compatibility.py install-app --stack "$RUNNER_TEMP/nextcloud-lock/stack.json" --project "$PROJECT_NAME" app_api
          mkdir -p protocol/artifacts
          python3 talk-harness/scripts/nextcloud_compatibility.py observe --stack "$RUNNER_TEMP/nextcloud-lock/stack.json" --project "$PROJECT_NAME" --image "$NEXTCLOUD_IMAGE" --out protocol/artifacts/nextcloud-stack.json
          call_url=$(talk-harness/bin/cassini dev room create --name 'Cassini extension regression' | tail -n1)
          echo "NEXTCLOUD_TEST_CALL_URL=$call_url" >> "$GITHUB_ENV"
      - name: Detect the real call and preserve separate incoming PCM
        working-directory: protocol
        run: timeout 240 node tests/nextcloud-talk.mjs
      - name: Preserve Talk service logs
        if: always()
        run: |
          mkdir -p protocol/artifacts/nextcloud-services
          for service in nextcloud signaling janus; do
            docker compose -p "$PROJECT_NAME" -f talk-harness/harness/compose.yml logs --no-color "$service" > "protocol/artifacts/nextcloud-services/$service.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: nextcloud-talk-evidence
          path: protocol/artifacts/
      - name: Stop only this disposable Talk stack
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/nextcloud-lock/env.sh" ]; then
            source "$RUNNER_TEMP/nextcloud-lock/env.sh"
            timeout 180 talk-harness/bin/cassini dev stack down --volumes --services full --recording-backend none --cassini none
          fi
