# Tool configuration only: the application is built and installed with Meson.
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/export/cassini-read-pure.py", "tests/parakeet/tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
