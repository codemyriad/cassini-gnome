name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Cassini version and how it was installed
      placeholder: 0.1.0, Flatpak / .deb / source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Distribution
