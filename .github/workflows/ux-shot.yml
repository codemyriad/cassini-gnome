name: UX boards and Library interaction
on:
  push:
    branches: [main, 'ux/shot-spike']
  pull_request:
    paths:
      - 'meson.build'
      - 'meson_options.txt'
      - 'data/**'
      - 'build-aux/ci/**'
      - 'pyproject.toml'
      - 'src/**'
      - 'build-aux/ux-screenshot.sh'
      - 'build-aux/ux-boards.sh'
      - 'ux/library-vectors/**'
      - 'tests/ui/**'
      - '.github/workflows/ux-shot.yml'
  schedule:
    - cron: "51 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-window:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK and pinned screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good meson ninja-build gettext \
            libglib2.0-dev-bin libgtk-4-bin desktop-file-utils appstream xvfb xauth dbus-x11 \
            locales fontconfig python3-pil python3-pytest libzstd1 fonts-cantarell=0.303.1-4 fonts-inter=4.1+ds-1
          sudo locale-gen en_GB.UTF-8
      - name: Build a local installation
        run: |
          meson setup _build-shot --prefix="$PWD/_install-shot" -Dprofile=development
          meson install -C _build-shot
      - name: Render the real current window in private Xvfb
        run: |
          mkdir -p ux-artifacts
          build-aux/ux-boards.sh _install-shot/bin/cassini-viewer ux-artifacts
          CASSINI_SCREENSHOT_SCHEME=dark build-aux/ux-boards.sh _install-shot/bin/cassini-viewer ux-artifacts/dark
          python3 tests/ui/check-dark.py ux-artifacts/dark
          CASSINI_TEST_BUILD="$PWD/_build-shot" build-aux/ux-screenshot.sh tests/ui/library.py ux-artifacts/gui.png
          CASSINI_TEST_BUILD="$PWD/_build-shot" build-aux/ux-screenshot.sh tests/ui/meeting.py ux-artifacts/meeting-gui.png
          CASSINI_TEST_BUILD="$PWD/_build-shot" build-aux/ux-screenshot.sh tests/ui/quit.py ux-artifacts/quit-gui.png
          CASSINI_TEST_BUILD="$PWD/_build-shot" build-aux/ux-screenshot.sh tests/ui/refresh.py ux-artifacts/refresh-gui.png
          CASSINI_TEST_BUILD="$PWD/_build-shot" build-aux/ux-screenshot.sh tests/ui/recording.py ux-artifacts/recording-gui.png
          CASSINI_TEST_BUILD="$PWD/_build-shot" build-aux/ux-screenshot.sh tests/ui/import-export.py ux-artifacts/import-export-gui.png
          CASSINI_TEST_BUILD="$PWD/_build-shot" build-aux/ux-screenshot.sh tests/ui/search.py ux-artifacts/search-gui.png
          CASSINI_TEST_BUILD="$PWD/_build-shot" build-aux/ux-screenshot.sh tests/ui/model-notices.py ux-artifacts/notices-gui.png
          CASSINI_TEST_BUILD="$PWD/_build-shot" build-aux/ux-screenshot.sh tests/ui/settings.py ux-artifacts/settings-gui.png
          CASSINI_TEST_BUILD="$PWD/_build-shot" build-aux/ux-screenshot.sh tests/ui/library-move.py ux-artifacts/library-move-gui.png
          CASSINI_TEST_BUILD="$PWD/_build-shot" build-aux/ux-screenshot.sh tests/ui/speech-models.py ux-artifacts/speech-models.png
          CASSINI_SCREENSHOT_SCHEME=dark CASSINI_TEST_BUILD="$PWD/_build-shot" build-aux/ux-screenshot.sh tests/ui/speech-models.py ux-artifacts/dark/speech-models.png
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          root=Path('ux-artifacts/library')
          data=root.with_suffix('.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          width,height=struct.unpack('>II',data[16:24])
          assert (width,height) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/first-run.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/meeting.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/record-first.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/recording.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/dark/recording.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/received.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/export.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/search.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/dark/search.png').read_bytes()[16:24]) == (1120,720)
          for name in ['settings-recording','settings-transcription']:
              for folder in ['ux-artifacts','ux-artifacts/dark']:
                  assert struct.unpack('>II',Path(folder,f'{name}.png').read_bytes()[16:24]) == (1120,720)
          notification=json.loads(Path('ux-artifacts/notification.json').read_text())
          assert [button['action'] for button in notification['buttons']] == ['app.stop-recording','app.open-recording']
          info=json.loads(root.with_suffix('.json').read_text())
          assert info['renderer']=='cairo' and info['accent']=='blue' and info['light']
          assert info['tz']=='Europe/Rome' and info['lang']=='en_GB.UTF-8'
          assert info['font']=='Cantarell 11'
          PY
          dpkg-query -W fonts-cantarell fonts-inter > ux-artifacts/fonts.txt
          for font in Cantarell Inter; do fc-match -f '%{file}\n' "$font"; done | sort -u | xargs sha256sum > ux-artifacts/font-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-boards
          path: ux-artifacts/
          retention-days: 14
