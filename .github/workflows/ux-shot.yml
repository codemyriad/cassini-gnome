name: UX boards and Library interaction
on:
  workflow_call:
    inputs:
      product:
        type: string
        default: ""
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-window:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK and pinned screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-numpy gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good meson ninja-build gettext \
            libglib2.0-dev-bin libgtk-4-bin desktop-file-utils appstream xvfb xauth xdotool dbus-x11 \
            locales fontconfig python3-pil python3-pytest at-spi2-core gir1.2-atspi-2.0 libzstd1 fonts-cantarell=0.303.1-4 fonts-inter=4.1+ds-1
          sudo locale-gen en_GB.UTF-8 en_US.UTF-8
      - uses: actions/cache@v4
        if: inputs.product == ''
        with:
          path: .whistle-cache
          key: whistle-${{ hashFiles('whistle/pins.json') }}
      - uses: actions/cache@v4
        if: inputs.product == ''
        with:
          path: .sherpa-cache
          key: sherpa-${{ hashFiles('src/cassini_viewer/sherpa-pins.json') }}
      - name: Build a local installation for standalone dispatch
        if: inputs.product == ''
        run: |
          build-aux/whistle-cache.sh
          build-aux/sherpa-cache.sh
          meson setup _build-shot --prefix="$PWD/_install-shot" -Dprofile=development -Dwhistle=enabled -Dwhistle_cache="$PWD/.whistle-cache" -Dsherpa=enabled -Dsherpa_cache="$PWD/.sherpa-cache"
          meson install -C _build-shot
          echo "BOARD_APP=$PWD/_install-shot/bin/cassini-viewer" >> "$GITHUB_ENV"
          echo "CASSINI_BOARD_BUILD=$PWD/_build-shot" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        if: inputs.product != ''
        with:
          name: ${{ inputs.product }}
          path: _ci-download
      - name: Use exact development-profile build product
        if: inputs.product != ''
        run: |
          python3 build-aux/ci/product.py unpack _ci-boards _ci-download/boards.tar --commit "$GITHUB_SHA" --profile boards
          test ! -e /tmp/cassini-ci-boards
          cp -a _ci-boards/install /tmp/cassini-ci-boards
          echo "BOARD_APP=/tmp/cassini-ci-boards/bin/cassini-viewer" >> "$GITHUB_ENV"
          echo "CASSINI_BOARD_BUILD=$PWD/_ci-boards/build" >> "$GITHUB_ENV"
      - name: Render the real current window in private Xvfb
        run: |
          python3 -m pytest tests/test_ux_vectors.py -k locale_clock_style -q
          mkdir -p ux-artifacts
          build-aux/ux-boards.sh "$BOARD_APP" ux-artifacts
          CASSINI_SCREENSHOT_SCHEME=dark build-aux/ux-boards.sh "$BOARD_APP" ux-artifacts/dark
          python3 tests/ui/check-dark.py ux-artifacts/dark
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/library.py ux-artifacts/gui.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/meeting.py ux-artifacts/meeting-gui.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/trash.py ux-artifacts/trash.png
          CASSINI_SCREENSHOT_SCHEME=dark CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/trash.py ux-artifacts/dark/trash.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/speakers.py ux-artifacts/speakers-gui.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/voices.py ux-artifacts/voices-gui.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/voice-preparation.py ux-artifacts/voice-preparation.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/voice-models.py ux-artifacts/voice-models.png
          CASSINI_SCREENSHOT_SCHEME=dark CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/voices.py ux-artifacts/dark/voices-gui.png
          CASSINI_SCREENSHOT_SCHEME=dark CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/voice-models.py ux-artifacts/dark/voice-models.png
          CASSINI_SCREENSHOT_SCHEME=dark CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/speakers.py ux-artifacts/dark/speakers-gui.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/build-refresh.py ux-artifacts/build-refresh.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/quit.py ux-artifacts/quit-gui.png
          CASSINI_SNI_TEST_ISOLATED=1 dbus-run-session -- python3 tests/ui/status-notifier.py
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/background.py ux-artifacts/background.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/refresh.py ux-artifacts/refresh-gui.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/recording.py ux-artifacts/recording-gui.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/accessible-buttons.py ux-artifacts/accessible-buttons.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/import-export.py ux-artifacts/import-export-gui.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/rename.py ux-artifacts/rename.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/search.py ux-artifacts/search-gui.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/model-notices.py ux-artifacts/notices-gui.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/settings.py ux-artifacts/settings-gui.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/companion-click.py ux-artifacts/companion-click.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/companion.py ux-artifacts/companion-setup.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/recording-details.py ux-artifacts/recording-details.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/journey-parity.py ux-artifacts/journey-parity.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/companion-sandbox.py ux-artifacts/companion-sandbox.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/what-is-recorded.py ux-artifacts/what-is-recorded.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/library-move.py ux-artifacts/library-move-gui.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/library-publication.py ux-artifacts/library-publication-gui.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/speech-models.py ux-artifacts/speech-models.png
          CASSINI_SCREENSHOT_SCHEME=dark CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/speech-models.py ux-artifacts/dark/speech-models.png
          CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/diarization-models.py ux-artifacts/diarization-models.png
          CASSINI_SCREENSHOT_SCHEME=dark CASSINI_TEST_BUILD="$CASSINI_BOARD_BUILD" build-aux/ux-screenshot.sh tests/ui/diarization-models.py ux-artifacts/dark/diarization-models.png
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          root=Path('ux-artifacts/library')
          for state in ('browser', 'browser-dark', 'system', 'me', 'failed'):
              assert struct.unpack('>II',Path(f'ux-artifacts/what-is-recorded-{state}.png').read_bytes()[16:24]) == (1120,720)
          data=root.with_suffix('.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          width,height=struct.unpack('>II',data[16:24])
          assert (width,height) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/first-run.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/meeting.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/record-first.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/recording.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/dark/recording.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/received.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/export.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/search.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/dark/search.png').read_bytes()[16:24]) == (1120,720)
          for name in ['settings-recording','settings-transcription', 'saved-voices']:
              for folder in ['ux-artifacts','ux-artifacts/dark']:
                  assert struct.unpack('>II',Path(folder,f'{name}.png').read_bytes()[16:24]) == (1120,720)
          for folder in ['ux-artifacts', 'ux-artifacts/dark']:
              assert struct.unpack('>II',Path(folder,'speakers.png').read_bytes()[16:24]) == (1120,720)
              speakers = json.loads(Path(folder, 'speakers.json').read_text())
              assert speakers['speakersDialog'] == dict(id='guest', name='Giulia', saveEnabled=False, privatePrint=True, savedVoices=4), speakers
              settings = json.loads(Path(folder, 'settings-transcription.json').read_text())
              assert settings['speechModels'] == ['whistle', 'parakeet-ultra-0.6b-int8'], settings
              assert settings['diarizationOn'] is True, settings
          for state in ['pending', 'pending-dark', 'connected', 'connected-dark', 'failed']:
              assert struct.unpack('>II',Path(f'ux-artifacts/companion-setup-{state}.png').read_bytes()[16:24]) == (1120,720)
          notification=json.loads(Path('ux-artifacts/notification.json').read_text())
          assert [button['action'] for button in notification['buttons']] == ['app.stop-recording','app.open-recording']
          info=json.loads(root.with_suffix('.json').read_text())
          assert info['renderer']=='cairo' and info['accent']=='blue' and info['light']
          assert info['tz']=='Europe/Rome' and info['lang']=='en_GB.UTF-8'
          assert info['font']=='Cantarell 11'
          PY
          dpkg-query -W fonts-cantarell fonts-inter > ux-artifacts/fonts.txt
          for font in Cantarell Inter; do fc-match -f '%{file}\n' "$font"; done | sort -u | xargs sha256sum > ux-artifacts/font-sha256.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ux-boards
          path: ux-artifacts/
          retention-days: 14
