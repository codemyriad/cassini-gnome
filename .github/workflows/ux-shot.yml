name: UX boards and Library interaction
on:
  workflow_call:
    inputs:
      product:
        type: string
        default: ""
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  current-window:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CM_RUNNER_DESKTOP == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-26.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK and pinned screenshot fonts
        run: |
          sudo build-aux/ci/apt-install-bounded.sh gcc libc6-dev openbox x11-utils python3-gi python3-numpy gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good meson ninja-build gettext \
            libglib2.0-dev-bin libgtk-4-bin desktop-file-utils appstream xvfb xauth xdotool dbus-x11 \
            locales fontconfig python3-pil python3-pytest at-spi2-core gir1.2-atspi-2.0 libzstd1 fonts-cantarell=0.303.1-4 fonts-inter=4.1+ds-1
          command -v gh >/dev/null || sudo build-aux/ci/apt-install-bounded.sh gh
          sudo locale-gen en_GB.UTF-8 en_US.UTF-8
      - uses: actions/cache@v6
        if: inputs.product == ''
        with:
          path: .whistle-cache
          key: whistle-${{ hashFiles('whistle/pins.json') }}
      - uses: actions/cache@v6
        if: inputs.product == ''
        with:
          path: .sherpa-cache
          key: sherpa-${{ hashFiles('src/cassini_talk/sherpa-pins.json') }}
      - name: Build a local installation for standalone dispatch
        if: inputs.product == ''
        run: |
          build-aux/whistle-cache.sh
          build-aux/sherpa-cache.sh
          meson setup _build-shot --prefix="$PWD/_install-shot" -Dprofile=development -Dwhistle=enabled -Dwhistle_cache="$PWD/.whistle-cache" -Dsherpa=enabled -Dsherpa_cache="$PWD/.sherpa-cache"
          meson install -C _build-shot
          echo "BOARD_APP=$PWD/_install-shot/bin/cassini-talk" >> "$GITHUB_ENV"
          echo "CASSINI_BOARD_BUILD=$PWD/_build-shot" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        if: inputs.product != ''
        with:
          name: ${{ inputs.product }}
          path: _ci-download
      - name: Use exact development-profile build product
        if: inputs.product != ''
        run: |
          python3 build-aux/ci/product.py unpack _ci-boards _ci-download/boards.tar --commit "$GITHUB_SHA" --profile boards
          test ! -e /tmp/cassini-ci-boards
          cp -a _ci-boards/install /tmp/cassini-ci-boards
          echo "BOARD_APP=/tmp/cassini-ci-boards/bin/cassini-talk" >> "$GITHUB_ENV"
          echo "CASSINI_BOARD_BUILD=$PWD/_ci-boards/build" >> "$GITHUB_ENV"
      - name: Render the real current window in private Xvfb
        run: |
          env -u GITHUB_STEP_SUMMARY python3 -I build-aux/ci/pr-shots.py --self-test
          python3 -m pytest tests/test_ux_vectors.py -k locale_clock_style -q
          build-aux/ux-shots.sh "$BOARD_APP" "$CASSINI_BOARD_BUILD" ux-artifacts
          CASSINI_SNI_TEST_ISOLATED=1 dbus-run-session -- python3 tests/ui/status-notifier.py
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          root=Path('ux-artifacts/library')
          for state in ('browser', 'browser-dark', 'system', 'me', 'failed'):
              assert struct.unpack('>II',Path(f'ux-artifacts/what-is-recorded-{state}.png').read_bytes()[16:24]) == (1120,720)
          data=root.with_suffix('.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          width,height=struct.unpack('>II',data[16:24])
          assert (width,height) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/first-run.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/meeting.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/record-first.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/recording.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/dark/recording.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/received.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/export.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/search.png').read_bytes()[16:24]) == (1120,720)
          assert struct.unpack('>II',Path('ux-artifacts/dark/search.png').read_bytes()[16:24]) == (1120,720)
          for name in ['settings-recording','settings-transcription', 'saved-voices']:
              for folder in ['ux-artifacts','ux-artifacts/dark']:
                  assert struct.unpack('>II',Path(folder,f'{name}.png').read_bytes()[16:24]) == (1120,720)
          for folder in ['ux-artifacts', 'ux-artifacts/dark']:
              assert struct.unpack('>II',Path(folder,'speakers.png').read_bytes()[16:24]) == (1120,720)
              speakers = json.loads(Path(folder, 'speakers.json').read_text())
              assert speakers['speakersDialog'] == dict(id='guest', name='Giulia', saveEnabled=False, privatePrint=True, savedVoices=4), speakers
              settings = json.loads(Path(folder, 'settings-transcription.json').read_text())
              assert settings['speechModels'] == ['whistle', 'parakeet-ultra-0.6b-int8-v2'], settings
              assert settings['diarizationOn'] is True, settings
          for state in ['pending', 'pending-dark', 'connected', 'connected-dark', 'failed']:
              assert struct.unpack('>II',Path(f'ux-artifacts/companion-setup-{state}.png').read_bytes()[16:24]) == (1120,720)
          notification=json.loads(Path('ux-artifacts/notification.json').read_text())
          assert [button['action'] for button in notification['buttons']] == ['app.stop-recording','app.open-recording']
          info=json.loads(root.with_suffix('.json').read_text())
          assert info['renderer']=='cairo' and info['light']
          assert info['tz']=='Europe/Rome' and info['lang']=='en_GB.UTF-8'
          assert info['font']=='Cantarell 11'
          shots=json.loads(Path('ux-artifacts/shots.json').read_text())
          assert shots['app']=='gnome' and len(shots['shots']) >= 152 and len(shots['shots']) % 2 == 0
          PY
          dpkg-query -W fonts-cantarell fonts-inter > ux-artifacts/fonts.txt
          dpkg-query -W libgtk-4-1 libadwaita-1-0 libcairo2 libpango-1.0-0 python3-pil > ux-artifacts/packages.txt
          for font in Cantarell Inter; do fc-match -f '%{file}\n' "$font"; done | sort -u | xargs sha256sum > ux-artifacts/font-sha256.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ux-boards
          path: ux-artifacts/
          retention-days: 14
      - name: Compare UI screenshots against main baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_RUNNER: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.CM_RUNNER_DESKTOP == 'hetzner' && 'self-hosted,cm-hetzner' || 'ubuntu-26.04' }}
        run: |
          if gh api --help 2>&1 | grep -q -- '--allow-escape-sequences'; then
            mkdir -p "$RUNNER_TEMP/gh-bin"
            real_gh=$(command -v gh)
            printf '#!/bin/sh\nif [ "${1:-}" = "api" ] && [ "${2#*/actions/jobs/}" != "${2:-}" ]; then\n  shift\n  exec "%s" api --allow-escape-sequences "$@"\nfi\nexec "%s" "$@"\n' "$real_gh" "$real_gh" > "$RUNNER_TEMP/gh-bin/gh"
            chmod +x "$RUNNER_TEMP/gh-bin/gh"
            export PATH="$RUNNER_TEMP/gh-bin:$PATH"
          fi
          rm -rf pr-shots
          wf=ci
          python3 -I build-aux/ci/pr-shots.py diff \
            --layout gnome \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --head-runner "$HEAD_RUNNER" \
            --after-dir ux-artifacts \
            --base-workflow "$wf.yml" \
            --base-artifact ux-boards \
            --out pr-shots
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: pr-shots
          path: pr-shots/
          retention-days: 14
