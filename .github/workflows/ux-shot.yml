name: Cairo shadow cache app comparison (evidence only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heartbeat-pairs:
    runs-on: [self-hosted, cm-hetzner]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the existing Boards dependencies and pinned fonts
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y gcc libc6-dev openbox x11-utils python3-gi python3-numpy gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good meson ninja-build gettext libglib2.0-dev-bin libgtk-4-bin desktop-file-utils appstream xvfb xauth xdotool dbus-x11 locales fontconfig python3-pil python3-pytest at-spi2-core gir1.2-atspi-2.0 libzstd1 fonts-cantarell=0.303.1-4 fonts-inter=4.1+ds-1
          sudo locale-gen en_GB.UTF-8 en_US.UTF-8
      - name: Build the same development-profile resource used by the test
        run: |
          meson setup _build-heartbeat -Dprofile=development
          meson compile -C _build-heartbeat
      - name: "Twelve fixed pairs: retain budget failures and per-frame CPU/wall times"
        run: python3 build-aux/ci/heartbeat-pairs-evidence.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: companion-heartbeat-pairs
          path: heartbeat-evidence/
          retention-days: 14
