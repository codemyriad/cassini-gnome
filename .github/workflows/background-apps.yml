name: GNOME Background Apps
on:
  workflow_call:
    inputs:
      package_run:
        type: string
        default: ""
      include_flatpak:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      package_run:
        description: CI run with the matching deb-0 (and Flatpak when include_flatpak is true) artifacts
        required: true
      include_flatpak:
        description: Also install and test the Flatpak bundle alongside the installed deb
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
env:
  CASSINI_HARNESS_BASES: ubuntu:26.04@sha256:0d5255be560e2d2ddcfbfda88549e9e815ef29e7cd7fc62183d5709e6e2963c6 debian:testing@sha256:bdb44a6e90e7ee02e032121a81fae9f945ce86b9454c6d0d71bc43cb595ba17f
jobs:
  desktop:
    name: ${{ inputs.include_flatpak && 'GNOME 50 / installed deb and Flatpak' || 'GNOME 50 / installed deb' }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CM_RUNNER_DESKTOP == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-26.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: deb-0
          path: _desktop-packages/deb
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run || github.run_id }}
      - uses: actions/download-artifact@v8
        if: ${{ inputs.include_flatpak }}
        with:
          name: cassini-talk-devel-x86_64.flatpak
          path: _desktop-packages/flatpak
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run || github.run_id }}
      # A self-hosted pool host may hold these already (build-aux/ci/pool-prefetch.sh); elsewhere all false.
      - name: Use the pool host's GNOME 50 runtime
        id: prefetch
        run: build-aux/ci/pool-prefetch.sh flatpak >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: ${{ inputs.include_flatpak && steps.prefetch.outputs.flatpak != 'true' }}
        with:
          path: .desktop-flatpak-cache
          key: desktop-gnome50-v1
      # C (D66): the harness images of tests/harness-image.sh, from a cache main
      # saves and pull requests only read; their key changes every week and with
      # every input. run.sh builds an image the cache did not hold.
      - name: Harness image cache key
        id: harness
        run: build-aux/ci/harness-cache.sh key desktop >> "$GITHUB_OUTPUT"
      - name: Use the pool host's harness image
        id: harness-pool
        run: build-aux/ci/pool-prefetch.sh harness:desktop >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        if: steps.harness-pool.outputs.harness-desktop != 'true'
        id: harness-cache
        with:
          path: ${{ steps.harness.outputs.path }}
          key: ${{ steps.harness.outputs.key }}
      - name: Load the cached harness images
        if: steps.harness-cache.outputs.cache-hit == 'true'
        run: build-aux/ci/harness-cache.sh load "${{ steps.harness.outputs.path }}"
      - name: Background Apps, app-grid reopen, and stop-and-keep on quit
        run: |
          if [ "${{ inputs.include_flatpak }}" = "true" ]; then
            CASSINI_DESKTOP_FLATPAK_CACHE="$PWD/.desktop-flatpak-cache" \
              tests/desktop/run.sh _desktop-packages/deb/cassini-talk_*.deb _desktop-packages/flatpak/*.flatpak desktop-evidence
          else
            tests/desktop/run.sh --deb-only _desktop-packages/deb/cassini-talk_*.deb desktop-evidence
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ failure() || (github.event_name != 'pull_request' && always()) }}
        with:
          name: background-apps-desktop
          path: |
            desktop-evidence/*/*.json
            desktop-evidence/*/*.log
            desktop-evidence/*/*.png
          retention-days: 7
      - name: Save the harness images (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.harness-pool.outputs.harness-desktop != 'true' && steps.harness-cache.outputs.cache-hit != 'true'
        run: build-aux/ci/harness-cache.sh save "${{ steps.harness.outputs.path }}" desktop
      - uses: actions/cache/save@v6
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.harness-pool.outputs.harness-desktop != 'true' && steps.harness-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.harness.outputs.path }}
          key: ${{ steps.harness.outputs.key }}
