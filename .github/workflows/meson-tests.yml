name: Meson tests
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
# H: the tests the Build job used to run before packing its products, in the
# same minimal environment, beside it instead of ahead of Recording, Boards and
# Offline. CI's Pytest coverage gate fails unless this job passed.
jobs:
  meson-tests:
    name: Meson tests (minimal environment)
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    # 3.4-4.5 min on the last main pushes (D66: 2-4x p95).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools (minimal source-validation environment)
        run: |
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends meson ninja-build python3 python3-pytest python3-jsonschema python3-rfc3339-validator \
            gcc libc6-dev git ca-certificates zstd gettext libglib2.0-bin libglib2.0-dev-bin desktop-file-utils appstream libgtk-4-bin
      - name: Default profile, all existing Meson tests and POT validation
        run: |
          meson setup _build-core
          meson test -C _build-core --print-errorlogs
          meson compile -C _build-core cassini-talk-pot
