name: Meson tests
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
env:
  CONTAINER_ENGINE: docker
  GHCR_READ_TOKEN: ${{ github.token }}
# H: the tests the Build job used to run before packing its products, in the
# same minimal environment, beside it instead of ahead of Recording, Boards and
# Offline. CI's Pytest coverage gate fails unless this job passed.
jobs:
  meson-tests:
    name: Meson tests (minimal environment)
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CM_RUNNER == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-26.04' }}
    # 3.4-4.5 min on the last main pushes (D66: 2-4x p95).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools (minimal source-validation environment)
        run: |
          echo "CASSINI_BUILD_IMAGE=$(python3 build-aux/ci/prepare_build_image.py ubuntu:26.04@sha256:065aa8626841f16057b78b027b464cd59c4fac36c204c72dcbf48d66f5fa8a96)" >> "$GITHUB_ENV"
      - name: Configure the default profile
        run: |
          build-aux/ci/run-in-build-image.sh meson setup _build-core -Dpytest_parallel=true
      - name: Run every Meson test with live hang diagnostics
        shell: bash
        env:
          PYTEST_ADDOPTS: '-vv -o faulthandler_timeout=60'
          CASSINI_PERF_GATE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '1' || '' }}
        run: |
          set -o pipefail
          # Keep Meson's individual limits; leave time to retain logs before
          # the job's 15-minute deadline. Normal runs take 3.4-4.5 minutes.
          build-aux/ci/run-in-build-image.sh build-aux/bounded-run.sh 600 meson test -C _build-core --print-errorlogs --verbose --num-processes=2 2>&1 | tee _build-core/meson-tests-live.log
      - name: Validate POT generation
        run: |
          build-aux/ci/run-in-build-image.sh meson compile -C _build-core cassini-talk-pot
      - uses: actions/upload-artifact@v7
        if: ${{ failure() || (github.event_name != 'pull_request' && always()) }}
        with:
          name: meson-logs-minimal
          path: |
            _build-core/meson-logs/
            _build-core/meson-tests-live.log
