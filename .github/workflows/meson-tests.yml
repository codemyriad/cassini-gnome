name: Meson tests
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
# H: the tests the Build job used to run before packing its products, in the
# same minimal environment, beside it instead of ahead of Recording, Boards and
# Offline. CI's Pytest coverage gate fails unless this job passed.
jobs:
  meson-tests:
    name: Meson tests (minimal environment)
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CM_RUNNER == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-26.04' }}
    container: ubuntu:26.04
    # 3.4-4.5 min on the last main pushes (D66: 2-4x p95).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools (minimal source-validation environment)
        run: |
          apt-get -o Acquire::Retries=5 -o Acquire::Retries::Delay=true -o Acquire::Retries::Delay::Maximum=5 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o APT::Update::Error-Mode=any update
          apt-get -o Acquire::Retries=5 -o Acquire::Retries::Delay=true -o Acquire::Retries::Delay::Maximum=5 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o APT::Update::Error-Mode=any install -y --no-install-recommends meson ninja-build python3 python3-pytest python3-jsonschema python3-rfc3339-validator \
            gcc libc6-dev git ca-certificates zstd gettext libglib2.0-bin libglib2.0-dev-bin desktop-file-utils appstream libgtk-4-bin
      - name: Configure the default profile
        run: |
          meson setup _build-core -Dpytest_parallel=true
      - name: Run every Meson test with live hang diagnostics
        shell: bash
        env:
          PYTEST_ADDOPTS: '-vv -o faulthandler_timeout=60'
        run: |
          set -o pipefail
          # Keep Meson's individual limits; leave time to retain logs before
          # the job's 15-minute deadline. Normal runs take 3.4-4.5 minutes.
          build-aux/bounded-run.sh 600 meson test -C _build-core --print-errorlogs --verbose --num-processes=2 2>&1 | tee _build-core/meson-tests-live.log
      - name: Validate POT generation
        run: |
          meson compile -C _build-core cassini-talk-pot
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: meson-logs-minimal
          path: |
            _build-core/meson-logs/
            _build-core/meson-tests-live.log
