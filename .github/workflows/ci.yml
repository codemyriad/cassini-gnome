name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "11 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
# D66: a newer push to a pull request cancels that PR's older run. Other runs
# (main pushes, the nightly schedule, dispatch) get their own group by run id,
# so they never queue behind or cancel each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.areas.outputs.source }}
      packages: ${{ steps.areas.outputs.packages }}
      recording: ${{ steps.areas.outputs.recording }}
      boards: ${{ steps.areas.outputs.boards }}
      library: ${{ steps.areas.outputs.library }}
      offline: ${{ steps.areas.outputs.offline }}
      deb_testing: ${{ steps.areas.outputs.deb_testing }}
      rpm_opensuse: ${{ steps.areas.outputs.rpm_opensuse }}
      arch: ${{ steps.areas.outputs.arch }}
      flatpak: ${{ steps.areas.outputs.flatpak }}
      extra_distros: ${{ steps.areas.outputs.extra_distros }}
      full_ci: ${{ steps.areas.outputs.full_ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect PR paths, defaulting to every area on failure
        id: areas
        run: python3 build-aux/ci/changes.py --report changed-areas.json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: changed-areas
          path: changed-areas.json
  build:
    name: Build
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build.yml
    with:
      # Failed detection must override even partially written false outputs.
      boards: ${{ needs.changes.result != 'success' || needs.changes.outputs.boards != 'false' }}
      offline: ${{ needs.changes.result != 'success' || needs.changes.outputs.offline != 'false' }}
  # H: Build packs the products Recording, Boards and Offline test; the Meson
  # tests run beside it, and the Pytest coverage gate fails unless they passed.
  meson-tests:
    name: Meson tests
    uses: ./.github/workflows/meson-tests.yml
  source:
    # Coverage requires the complete Source/package proof matrix for every enabled
    # leg. !cancelled() and != 'false' fail open even if changes detection fails.
    name: Source
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/source.yml
    with:
      deb_testing: ${{ needs.changes.result != 'success' || needs.changes.outputs.deb_testing != 'false' }}
      rpm_opensuse: ${{ needs.changes.result != 'success' || needs.changes.outputs.rpm_opensuse != 'false' }}
      arch: ${{ needs.changes.result != 'success' || needs.changes.outputs.arch != 'false' }}
      extra_distros: ${{ needs.changes.result != 'success' || needs.changes.outputs.extra_distros != 'false' }}
  # The package workflows are called directly, so Desktop waits only for the
  # deb (and Flatpak when enabled), not for the RPM and Arch builds (G2).
  deb:
    name: Debian package
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/deb.yml
    with:
      deb_testing: ${{ needs.changes.result != 'success' || needs.changes.outputs.deb_testing != 'false' }}
  rpm-arch:
    name: RPM and Arch packages
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/packages.yml
    with:
      rpm_opensuse: ${{ needs.changes.result != 'success' || needs.changes.outputs.rpm_opensuse != 'false' }}
      arch: ${{ needs.changes.result != 'success' || needs.changes.outputs.arch != 'false' }}
  flatpak:
    name: Flatpak
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.flatpak != 'false' && needs.changes.outputs.packages != 'false')) }}
    uses: ./.github/workflows/flatpak.yml
  # G11: a Source distro job skips pytest only where a package job runs it.
  # Each Source job uploads the node ids its pytest ran, or pytest-skipped-
  # <image>; each package job that proved a complete run uploads its node
  # ids as pytest-ran-<image>. This fails on any skip without that proof
  # from the same release, and on any package job that left out a test the
  # tier's Fedora Source job ran, whatever skipped, narrowed or broke it.
  # It also fails unless the Meson tests, Build's until H, ran and passed.
  pytest-coverage:
    name: Pytest coverage
    needs: [changes, source, deb, rpm-arch, meson-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: pytest-*
          path: ${{ runner.temp }}/pytest
      - name: Every skipped pytest suite ran in full in a package job of the same release
        env:
          CHANGES: ${{ needs.changes.result }}
          DEB_TESTING: ${{ needs.changes.outputs.deb_testing }}
          RPM_OPENSUSE: ${{ needs.changes.outputs.rpm_opensuse }}
          ARCH: ${{ needs.changes.outputs.arch }}
          EXTRA_DISTROS: ${{ needs.changes.outputs.extra_distros }}
        run: |
          python3 build-aux/ci/check_pytest_ran.py --gate "$RUNNER_TEMP/pytest" \
            --changes-result "$CHANGES" \
            --deb-testing "$DEB_TESTING" \
            --rpm-opensuse "$RPM_OPENSUSE" \
            --arch "$ARCH" \
            --extra-distros "$EXTRA_DISTROS"
      - name: Source and package callers ran and passed
        if: ${{ !cancelled() }}
        env:
          SOURCE: ${{ needs.source.result }}
          DEB: ${{ needs.deb.result }}
          RPM_ARCH: ${{ needs.rpm-arch.result }}
        run: |
          status=0
          test "$SOURCE" = success || { echo "::error::Source $SOURCE, not success"; status=1; }
          test "$DEB" = success || { echo "::error::Debian package $DEB, not success"; status=1; }
          test "$RPM_ARCH" = success || { echo "::error::RPM and Arch packages $RPM_ARCH, not success"; status=1; }
          exit "$status"
      - name: The Meson tests ran and passed
        if: ${{ !cancelled() }}
        env:
          MESON_TESTS: ${{ needs.meson-tests.result }}
        run: test "$MESON_TESTS" = success || { echo "::error::Meson tests $MESON_TESTS, not success"; exit 1; }
  # Recording, Boards and Offline test Build's product: after a failed Build
  # they are skipped, not failed at the artifact download (G7).
  recording:
    name: Recording
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.recording != 'false') }}
    uses: ./.github/workflows/recording.yml
    with:
      product: ci-core
  boards:
    name: Boards
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.boards != 'false') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ux-shot.yml
    with:
      product: ci-boards
  library:
    name: Library
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.library != 'false') }}
    uses: ./.github/workflows/ux-library.yml
  offline:
    name: Offline
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.offline != 'false') }}
    uses: ./.github/workflows/whistle.yml
    with:
      product: ci-offline
  desktop:
    name: Desktop
    needs: [changes, deb, flatpak]
    if: ${{ always() && !cancelled() && needs.deb.result == 'success' && ((needs.changes.result == 'success' && needs.changes.outputs.flatpak == 'false' && needs.flatpak.result == 'skipped') || needs.flatpak.result == 'success') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/background-apps.yml
    with:
      include_flatpak: ${{ needs.changes.result != 'success' || needs.changes.outputs.flatpak != 'false' }}
