name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "11 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
# D66: a newer push to a pull request cancels that PR's older run. Other runs
# (main pushes, the nightly schedule, dispatch) get their own group by run id,
# so they never queue behind or cancel each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.areas.outputs.source }}
      packages: ${{ steps.areas.outputs.packages }}
      recording: ${{ steps.areas.outputs.recording }}
      boards: ${{ steps.areas.outputs.boards }}
      library: ${{ steps.areas.outputs.library }}
      offline: ${{ steps.areas.outputs.offline }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect PR paths, defaulting to every area on failure
        id: areas
        run: python3 build-aux/ci/changes.py --report changed-areas.json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: changed-areas
          path: changed-areas.json
  build:
    name: Build
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build.yml
    with:
      # Failed detection must override even partially written false outputs.
      boards: ${{ needs.changes.result != 'success' || needs.changes.outputs.boards != 'false' }}
      offline: ${{ needs.changes.result != 'success' || needs.changes.outputs.offline != 'false' }}
  source:
    name: Source
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.source != 'false') }}
    uses: ./.github/workflows/source.yml
  # The three package workflows are called directly, so Desktop waits only for
  # the deb and Flatpak it installs, not for the RPM and Arch builds (G2).
  deb:
    name: Debian package
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.packages != 'false') }}
    uses: ./.github/workflows/deb.yml
  rpm-arch:
    name: RPM and Arch packages
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.packages != 'false') }}
    uses: ./.github/workflows/packages.yml
  flatpak:
    name: Flatpak
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.packages != 'false') }}
    uses: ./.github/workflows/flatpak.yml
  # G11: a Source distro job skips pytest only where a package job runs it.
  # Each skip uploads pytest-skipped-<image>, and each package job that
  # proved a complete run uploads pytest-ran-<image>; any skip without its
  # proof fails here, whatever skipped, excluded or broke the package job.
  pytest-coverage:
    name: Pytest coverage
    needs: [source, deb, rpm-arch]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Every image whose Source job skipped pytest ran it in its package job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            -q '.artifacts[].name' > "$RUNNER_TEMP/artifacts"
          python3 build-aux/ci/check_pytest_ran.py --gate "$RUNNER_TEMP/artifacts"
  # Recording, Boards and Offline test Build's product: after a failed Build
  # they are skipped, not failed at the artifact download (G7).
  recording:
    name: Recording
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.recording != 'false') }}
    uses: ./.github/workflows/recording.yml
    with:
      product: ci-core
  boards:
    name: Boards
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.boards != 'false') }}
    uses: ./.github/workflows/ux-shot.yml
    with:
      product: ci-boards
  library:
    name: Library
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.library != 'false') }}
    uses: ./.github/workflows/ux-library.yml
  offline:
    name: Offline
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.offline != 'false') }}
    uses: ./.github/workflows/whistle.yml
    with:
      product: ci-offline
  desktop:
    name: Desktop
    needs: [deb, flatpak]
    if: ${{ !cancelled() && needs.deb.result == 'success' && needs.flatpak.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/background-apps.yml
