name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The runners have both; the build scripts would pick podman, but rootful
# docker is what they are tested with.
env:
  CONTAINER_ENGINE: docker

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff pytest
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: Install system Python audio test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest python3-jsonschema python3-rfc3339-validator python3-gi gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - run: /usr/bin/python3 -m pytest -q

  meson:
    name: Meson build and validate
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends meson ninja-build python3 python3-pytest python3-jsonschema python3-rfc3339-validator \
            gettext libglib2.0-bin libglib2.0-dev-bin desktop-file-utils appstream libgtk-4-bin
      - run: meson setup _build
      - run: meson test -C _build --print-errorlogs
      - run: meson compile -C _build cassini-viewer-pot
      - run: DESTDIR=$PWD/_install meson install -C _build

  distros:
    name: Build and test on ${{ matrix.image }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:testing
          - ubuntu:26.04
          - fedora:latest
          - registry.opensuse.org/opensuse/tumbleweed:latest
          - archlinux:latest
          - alpine:edge
    steps:
      - uses: actions/checkout@v5
      # Retried once because distribution mirrors occasionally time out.
      - run: build-aux/check-distros.sh "${{ matrix.image }}" || build-aux/check-distros.sh "${{ matrix.image }}"

  deb:
    name: Debian package
    uses: ./.github/workflows/deb.yml

  packages:
    name: RPM and Arch packages
    uses: ./.github/workflows/packages.yml

  flatpak:
    name: Flatpak
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: cassini-viewer-devel.flatpak
          manifest-path: build-aux/flatpak/com.gocassini.Viewer.Devel.json
          cache-key: flatpak-builder-${{ github.sha }}
      # The same offline check as the other packages: install the bundle and
      # write the D11 goldens down in a sandbox with --unshare=network.
      - name: Smoke-test the installed Flatpak offline
        run: build-aux/flatpak/smoke.sh cassini-viewer-devel.flatpak com.gocassini.Viewer.Devel
