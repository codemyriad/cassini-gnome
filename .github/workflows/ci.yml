name: CI
on:
  push:
    branches: [main, 'ux/shot-spike', 'ux/1a-library-model']
  pull_request:
  schedule:
    - cron: "11 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
# No automatic cancellation: superseded heads are cancelled manually.
jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-26.04
    outputs:
      source: ${{ steps.areas.outputs.source }}
      packages: ${{ steps.areas.outputs.packages }}
      recording: ${{ steps.areas.outputs.recording }}
      boards: ${{ steps.areas.outputs.boards }}
      library: ${{ steps.areas.outputs.library }}
      offline: ${{ steps.areas.outputs.offline }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect PR paths, defaulting to every area on failure
        id: areas
        run: python3 build-aux/ci/changes.py --report changed-areas.json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: changed-areas
          path: changed-areas.json
  build:
    name: Build
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build.yml
    with:
      # Failed detection must override even partially written false outputs.
      boards: ${{ needs.changes.result != 'success' || needs.changes.outputs.boards != 'false' }}
      offline: ${{ needs.changes.result != 'success' || needs.changes.outputs.offline != 'false' }}
  source:
    name: Source
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.source != 'false') }}
    uses: ./.github/workflows/source.yml
  packages:
    name: Packaging
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.packages != 'false') }}
    uses: ./.github/workflows/packaging.yml
  recording:
    name: Recording
    needs: [changes, build]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.recording != 'false') }}
    uses: ./.github/workflows/recording.yml
    with:
      product: ci-core
  boards:
    name: Boards
    needs: [changes, build]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.boards != 'false') }}
    uses: ./.github/workflows/ux-shot.yml
    with:
      product: ci-boards
  library:
    name: Library
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.library != 'false') }}
    uses: ./.github/workflows/ux-library.yml
  offline:
    name: Offline
    needs: [changes, build]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.offline != 'false') }}
    uses: ./.github/workflows/whistle.yml
    with:
      product: ci-offline
  desktop:
    name: Desktop
    needs: packages
    if: ${{ !cancelled() && needs.packages.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/background-apps.yml
