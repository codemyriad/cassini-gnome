name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  main-inputs:
    name: Require exact green main inputs
    runs-on: ubuntu-26.04
    outputs:
      run_id: ${{ steps.main.outputs.run_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Require the tag to match every source and package version
        run: python3 build-aux/ci/release_metadata.py --tag "$GITHUB_REF_NAME"
      - name: Require all main checks and the five package artifacts
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build-aux/ci/green_main.py --repo "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)" --output "$GITHUB_OUTPUT"

  deb:
    name: Reuse verified Debian packages
    needs: main-inputs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.main-inputs.outputs.run_id }}
          pattern: deb-*
          merge-multiple: true
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-deb
          path: dist/*.deb
          if-no-files-found: error

  packages:
    name: Reuse verified RPM and Arch packages
    needs: main-inputs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.main-inputs.outputs.run_id }}
          pattern: rpm-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.main-inputs.outputs.run_id }}
          name: arch
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error

  flatpak:
    needs: main-inputs
    uses: ./.github/workflows/release-check.yml

  publish:
    needs: [deb, packages, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R artifacts
          # The packages carry the x86_64 writing-down engine: amd64 .debs
          # (one per base), x86_64 RPMs and Arch package, an x86_64 Flatpak.
          mapfile -d '' bundles < <(find artifacts -type f \( -name '*.deb' -o -name '*.flatpak' -o -name '*.x86_64.rpm' -o -name '*.pkg.tar.zst' \) -print0)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes "${bundles[@]}"
