name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  main-inputs:
    name: Require exact green main inputs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.main.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Require the tag to match every source and package version
        run: python3 build-aux/ci/release_metadata.py --tag "$GITHUB_REF_NAME"
      - name: Require all main checks and the six package artifacts
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build-aux/ci/green_main.py --repo "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)" --output "$GITHUB_OUTPUT"

  deb:
    name: Reuse verified Debian packages
    needs: main-inputs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.main-inputs.outputs.run_id }}
          pattern: deb-*
          merge-multiple: true
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-deb
          path: dist/*.deb
          if-no-files-found: error

  packages:
    name: Reuse verified RPM and Arch packages
    needs: main-inputs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.main-inputs.outputs.run_id }}
          pattern: rpm-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.main-inputs.outputs.run_id }}
          name: arch
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error

  # D45.3 (Silvio, 2026-11-05): Flathub is the Flatpak channel (listing
  # pending). Flathub builds, signs, hosts and updates io.codemyriad.CassiniTalk
  # from the manifest in its own repository, not on this tag push, so a release
  # attaches no Flatpak bundle: one without an update remote must not be
  # offered. The release ships the Debian, RPM and Arch packages.
  publish:
    needs: [deb, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/download-artifact@v8
        with:
          name: release-deb
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R artifacts
          # The packages carry the x86_64 writing-down engine: amd64 .debs
          # (one per base), x86_64 RPMs and the Arch package.
          mapfile -d '' bundles < <(find artifacts -type f \( -name '*.deb' -o -name '*.x86_64.rpm' -o -name '*.pkg.tar.zst' \) -print0)
          # The tagged version's NEWS section, in plain language, then GitHub's PR list.
          python3 source/build-aux/ci/release_notes.py "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --generate-notes "${bundles[@]}"
