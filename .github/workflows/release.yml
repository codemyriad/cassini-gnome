name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    uses: ./.github/workflows/deb.yml

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: cassini-viewer.flatpak
          manifest-path: build-aux/flatpak/com.gocassini.Viewer.json
          cache-key: flatpak-builder-${{ github.sha }}

  publish:
    needs: [deb, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R artifacts
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            $(find artifacts -name '*.deb' -o -name '*.flatpak')
