name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  main-inputs:
    name: Require exact green main inputs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.main.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Require the tag to match every source and package version
        run: python3 build-aux/ci/release_metadata.py --tag "$GITHUB_REF_NAME"
      - name: Require all main checks and the six package artifacts
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build-aux/ci/green_main.py --repo "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)" --output "$GITHUB_OUTPUT"

  deb:
    name: Reuse verified Debian packages
    needs: main-inputs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.main-inputs.outputs.run_id }}
          pattern: deb-*
          merge-multiple: true
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-deb
          path: dist/*.deb
          if-no-files-found: error

  packages:
    name: Reuse verified RPM and Arch packages
    needs: main-inputs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.main-inputs.outputs.run_id }}
          pattern: rpm-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.main-inputs.outputs.run_id }}
          name: arch
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error

  # G15: the stable Flatpak main built, validated and smoke-tested, not a
  # rebuild. It ships only when the signed D45.1 repository it names serves
  # its exact commit; until then this job fails the release instead.
  flatpak:
    name: Reuse the verified stable Flatpak
    needs: main-inputs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.main-inputs.outputs.run_id }}
          name: flatpak-stable
          path: dist
      # Fetches the remote the bundle names and verifies its summaries and
      # the bundle's commit with the key the bundle carries (gpgv).
      - name: Require the published, signed update remote to serve this bundle (D45.1)
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y python3-gi gpgv
          /usr/bin/python3 build-aux/ci/flatpak_bundle.py dist/cassini-talk.flatpak
      - uses: actions/upload-artifact@v7
        with:
          name: release-flatpak
          path: dist/cassini-talk.flatpak
          if-no-files-found: error

  publish:
    needs: [deb, packages, flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R artifacts
          # The packages carry the x86_64 writing-down engine: amd64 .debs
          # (one per base), x86_64 RPMs and Arch package, an x86_64 Flatpak.
          mapfile -d '' bundles < <(find artifacts -type f \( -name '*.deb' -o -name '*.flatpak' -o -name '*.x86_64.rpm' -o -name '*.pkg.tar.zst' \) -print0)
          # The tagged version's NEWS section, in plain language, then GitHub's PR list.
          python3 source/build-aux/ci/release_notes.py "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --generate-notes "${bundles[@]}"
