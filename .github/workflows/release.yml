name: Release

on:
  push:
    tags: ["v*", "!*-*"]

permissions:
  contents: write
  actions: read

jobs:
  main-inputs:
    name: Require exact green main inputs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.main.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Require the tag to match every source and package version
        run: python3 build-aux/ci/release_metadata.py --tag "$GITHUB_REF_NAME"
      - name: Require curated user-facing release notes for the tagged version
        run: python3 build-aux/ci/release_notes.py "$GITHUB_REF_NAME" > /dev/null
      - name: Require all main checks and the six package artifacts
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build-aux/ci/green_main.py --repo "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)" --output "$GITHUB_OUTPUT"

  deb:
    name: Reuse verified Debian packages
    needs: main-inputs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.main-inputs.outputs.run_id }}
          pattern: deb-*
          merge-multiple: true
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-deb
          path: dist/*.deb
          if-no-files-found: error

  packages:
    name: Reuse verified RPM and Arch packages
    needs: main-inputs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.main-inputs.outputs.run_id }}
          pattern: rpm-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.main-inputs.outputs.run_id }}
          name: arch
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error

  # D45.4 (Silvio, 2026-11-05): Linux ships the Debian, RPM and Arch packages
  # only. No Flatpak is published anywhere; a release never publishes or
  # attaches one (CI still builds it, as a check).
  publish:
    needs: [deb, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/download-artifact@v8
        with:
          name: release-deb
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R artifacts
          # The packages carry the x86_64 writing-down engine: exactly two amd64
          # .debs (one per base), two x86_64 RPMs and the Arch package, plus their
          # SHA256SUMS (sha256sum -c format, by file name), which is attached too.
          # A checked command (bash -e stops here), not a process substitution, whose
          # failure bash would discard: a refused set must never create a release.
          python3 source/build-aux/ci/release_sums.py artifacts --stage staged --sums SHA256SUMS > assets.txt
          mapfile -t assets < assets.txt
          test "${#assets[@]}" -eq 6
          # The tagged version's NEWS section, in plain language, then GitHub's PR list.
          python3 source/build-aux/ci/release_notes.py "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --generate-notes "${assets[@]}"
      # What a downloader gets: every attached package, fetched back from the
      # release, matches its SHA256SUMS line, and nothing is missing or extra.
      - name: Verify the published packages against SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir published
          cd published
          sha256sum --check --strict SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5
          diff <(ls | grep -vx SHA256SUMS | sort) <(cut -d' ' -f3- SHA256SUMS | sort)
