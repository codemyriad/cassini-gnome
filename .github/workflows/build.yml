name: Shared build products
on:
  workflow_call:
    inputs:
      boards:
        type: boolean
        default: true
      offline:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      boards:
        type: boolean
        default: true
      offline:
        type: boolean
        default: true
permissions:
  contents: read
# H: the products only. Recording, Boards and Offline wait for this workflow;
# the Meson tests run beside it in meson-tests.yml, which CI gates on too.
jobs:
  products:
    name: Meson build profiles
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    # About 1.5 min without the tests, 2.5 with a cold pin cache (D66: 2-4x p95).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools (minimal source-validation environment)
        run: |
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends meson ninja-build python3 python3-pytest python3-jsonschema python3-rfc3339-validator \
            gcc libc6-dev git ca-certificates zstd gettext libglib2.0-bin libglib2.0-dev-bin desktop-file-utils appstream libgtk-4-bin
      - name: Default profile
        run: |
          meson setup _build-core
          DESTDIR=$PWD/products/core/install meson install -C _build-core
          mkdir -p products/core/build/src
          cp _build-core/src/cassini-talk.gresource _build-core/src/libcassini-spectro.so products/core/build/src/
          python3 build-aux/ci/product.py pack products/core core.tar --commit "$GITHUB_SHA" --profile core
      - uses: actions/upload-artifact@v7
        with:
          name: ci-core
          path: core.tar
          compression-level: 0
          if-no-files-found: error
      - uses: actions/cache@v6
        if: inputs.boards || inputs.offline
        with:
          path: .whistle-cache
          key: whistle-${{ hashFiles('whistle/pins.json') }}
      - uses: actions/cache@v6
        if: inputs.boards || inputs.offline
        with:
          path: .sherpa-cache
          key: sherpa-${{ hashFiles('src/cassini_talk/sherpa-pins.json') }}
      - name: Pinned build-time fetches, never model downloads
        if: inputs.boards || inputs.offline
        run: |
          build-aux/whistle-cache.sh
          build-aux/whistle-cache.sh
          build-aux/sherpa-cache.sh
      - name: Development profile for boards
        if: inputs.boards
        run: |
          meson setup _build-boards --prefix=/tmp/cassini-ci-boards -Dprofile=development -Dwhistle=enabled -Dwhistle_cache="$PWD/.whistle-cache" -Dsherpa=enabled -Dsherpa_cache="$PWD/.sherpa-cache"
          DESTDIR=$PWD/products/boards/stage meson install -C _build-boards
          mv products/boards/stage/tmp/cassini-ci-boards products/boards/install
          rm -r products/boards/stage
          glib-compile-schemas products/boards/install/share/glib-2.0/schemas
          gtk4-update-icon-cache -q -t -f products/boards/install/share/icons/hicolor
          update-desktop-database -q products/boards/install/share/applications
          mkdir -p products/boards/build/src
          cp _build-boards/src/cassini-talk.gresource _build-boards/src/libcassini-spectro.so products/boards/build/src/
          python3 build-aux/ci/product.py pack products/boards boards.tar --commit "$GITHUB_SHA" --profile boards
      - uses: actions/upload-artifact@v7
        if: inputs.boards
        with:
          name: ci-boards
          path: boards.tar
          compression-level: 0
          if-no-files-found: error
      - name: Bundled-engine profile, offline configure and install
        if: inputs.offline
        run: |
          meson setup _build-offline --prefix=/usr --libdir=lib/x86_64-linux-gnu -Dwhistle=enabled -Dwhistle_cache="$PWD/.whistle-cache" -Dsherpa=enabled -Dsherpa_cache="$PWD/.sherpa-cache"
          DESTDIR=$PWD/products/offline/install meson install -C _build-offline
          python3 build-aux/ci/product.py pack products/offline offline.tar --commit "$GITHUB_SHA" --profile offline
      - uses: actions/upload-artifact@v7
        if: inputs.offline
        with:
          name: ci-offline
          path: offline.tar
          compression-level: 0
          if-no-files-found: error
