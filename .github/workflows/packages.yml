name: RPM and Arch packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The runners have both; the build scripts would pick podman, but rootful
# docker is what they are tested with.
env:
  CONTAINER_ENGINE: docker

jobs:
  rpm:
    name: Build .rpm (${{ matrix.base }})
    runs-on: ${{ vars.CM_RUNNER == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-26.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # fedora:latest ships Python 3.15, and onnxruntime has no cp315 wheel
          # yet (1.31.1 stops at cp314), so the pinned private ORT the package
          # bundles cannot be fetched (whistle/pins.json). Fedora 44 has Python
          # 3.14 and is supported until 2027-06 (43 ends 2026-12-02). The nightly
          # rpm-canary.yml builds fedora:latest outside the merge gate: when it
          # turns green, move this back to fedora:latest.
          - base: fedora:44
            name: fedora
          - base: registry.opensuse.org/opensuse/tumbleweed:latest
            name: opensuse
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo "CASSINI_PARAKEET_TEST_CACHE=$RUNNER_TEMP/parakeet-models" >> "$GITHUB_ENV"
          echo "CASSINI_TEST_LOGS=$RUNNER_TEMP/meson-logs" >> "$GITHUB_ENV"
      # The pinned writing-down artifacts (whistle/pins.json), downloaded once
      # per pin set; the package builds read them and never download.
      - uses: actions/cache@v6
        with:
          path: .whistle-cache
          key: whistle-${{ hashFiles('whistle/pins.json') }}
      - uses: actions/cache@v6
        with:
          path: .sherpa-cache
          key: sherpa-${{ hashFiles('src/cassini_talk/sherpa-pins.json') }}
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/parakeet-models
          key: parakeet-ultra-18cb623004dd6c15999b93cb70b14d8a1f6e8f3a2a97ff733f104bfc3494f6a9
      - run: build-aux/whistle-cache.sh
      # Builds in a container, installs in a fresh one and, with no network,
      # smoke-tests and writes the D11 goldens down. Run once (D66): the
      # script retries only its package installs and image pulls
      # (build-aux/ci/retry.sh), never the build or its tests.
      - run: build-aux/rpm/build.sh "${{ matrix.base }}"
      # G11: the Source job of this image skips pytest; prove it ran here in
      # full, then leave the node ids CI's Pytest coverage gate compares.
      - name: Require the whole pytest suite to have run and passed
        id: pytest
        run: |
          python3 build-aux/ci/check_pytest_ran.py "$CASSINI_TEST_LOGS" --export "$RUNNER_TEMP/pytest" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: pytest-ran-${{ steps.pytest.outputs.slug }}
          path: ${{ runner.temp }}/pytest/
          if-no-files-found: error
      # G3: the Meson test logs (testlog.txt with each shard's --durations,
      # testlog.json, the pytest junit XML), also on success, to track creep;
      # a shard over half its timeout becomes a warning annotation here.
      - name: Warn about pytest shards over half their budget
        if: always()
        run: grep -rhs '^::warning ' "$CASSINI_TEST_LOGS" --include=testlog.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: meson-logs-rpm-${{ matrix.name }}
          path: ${{ runner.temp }}/meson-logs/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.name }}
          path: dist/*.rpm

  arch:
    name: Build Arch package
    runs-on: ${{ vars.CM_RUNNER == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-26.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo "CASSINI_PARAKEET_TEST_CACHE=$RUNNER_TEMP/parakeet-models" >> "$GITHUB_ENV"
          echo "CASSINI_TEST_LOGS=$RUNNER_TEMP/meson-logs" >> "$GITHUB_ENV"
      # The pinned writing-down artifacts (whistle/pins.json), downloaded once
      # per pin set; the package builds read them and never download.
      - uses: actions/cache@v6
        with:
          path: .whistle-cache
          key: whistle-${{ hashFiles('whistle/pins.json') }}
      - uses: actions/cache@v6
        with:
          path: .sherpa-cache
          key: sherpa-${{ hashFiles('src/cassini_talk/sherpa-pins.json') }}
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/parakeet-models
          key: parakeet-ultra-18cb623004dd6c15999b93cb70b14d8a1f6e8f3a2a97ff733f104bfc3494f6a9
      - run: build-aux/whistle-cache.sh
      # Run once (D66): only package installs and image pulls are retried.
      - run: build-aux/arch/build.sh
      # G11: the Source job of this image skips pytest; prove it ran here in
      # full, then leave the node ids CI's Pytest coverage gate compares.
      - name: Require the whole pytest suite to have run and passed
        id: pytest
        run: |
          python3 build-aux/ci/check_pytest_ran.py "$CASSINI_TEST_LOGS" --export "$RUNNER_TEMP/pytest" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: pytest-ran-${{ steps.pytest.outputs.slug }}
          path: ${{ runner.temp }}/pytest/
          if-no-files-found: error
      # G3: the Meson test logs (testlog.txt with each shard's --durations,
      # testlog.json, the pytest junit XML), also on success, to track creep;
      # a shard over half its timeout becomes a warning annotation here.
      - name: Warn about pytest shards over half their budget
        if: always()
        run: grep -rhs '^::warning ' "$CASSINI_TEST_LOGS" --include=testlog.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: meson-logs-arch
          path: ${{ runner.temp }}/meson-logs/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: dist/*.pkg.tar.zst
