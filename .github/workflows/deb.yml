name: Debian package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The runners have both; build.sh would pick podman, but rootful docker is
# what it is tested with.
env:
  CONTAINER_ENGINE: docker

jobs:
  build:
    name: Build .deb (${{ matrix.base }})
    runs-on: ${{ vars.CM_RUNNER == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-26.04' }}
    timeout-minutes: 30
    # Both builds are required (G11): each runs the pytest suite its Source
    # distro job leaves to it. A failed debian:testing build already blocked
    # a release (green_main.py requires every main job to succeed); it no
    # longer leaves a pull request green either.
    strategy:
      fail-fast: false
      matrix:
        base: ["ubuntu:26.04", "debian:testing"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          echo "CASSINI_PARAKEET_TEST_CACHE=$RUNNER_TEMP/parakeet-models" >> "$GITHUB_ENV"
          echo "CASSINI_TEST_LOGS=$RUNNER_TEMP/meson-logs" >> "$GITHUB_ENV"
      # The pinned writing-down artifacts (whistle/pins.json), downloaded once
      # per pin set; the package builds read them and never download.
      - uses: actions/cache@v6
        with:
          path: .whistle-cache
          key: whistle-${{ hashFiles('whistle/pins.json') }}
      - uses: actions/cache@v6
        with:
          path: .sherpa-cache
          key: sherpa-${{ hashFiles('src/cassini_talk/sherpa-pins.json') }}
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/parakeet-models
          key: parakeet-ultra-v2-50c15b94ea9cb1c2f8dbcdcbc0f15b450169154deeb206923cb5388f60892366
      - run: build-aux/whistle-cache.sh
      # The same script as `make deb`: checks the version, builds, runs
      # lintian, installs the package in a fresh container and, with no
      # network, smoke-tests it and writes the D11 goldens down with it.
      # Run once (D66): the script retries only its package installs and
      # image pulls (build-aux/ci/retry.sh), never the build or its tests.
      - run: build-aux/deb/build.sh "${{ matrix.base }}"
      # G11: the Source job of this image skips pytest; prove it ran here in
      # full, then leave the node ids CI's Pytest coverage gate compares.
      - name: Require the whole pytest suite to have run and passed
        id: pytest
        run: |
          python3 build-aux/ci/check_pytest_ran.py "$CASSINI_TEST_LOGS" --export "$RUNNER_TEMP/pytest" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: pytest-ran-${{ steps.pytest.outputs.slug }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pytest/
          if-no-files-found: error
      # G3: the Meson test logs (testlog.txt with each shard's --durations,
      # testlog.json, the pytest junit XML), also on success, to track creep;
      # a shard over half its timeout becomes a warning annotation here.
      - name: Warn about pytest shards over half their budget
        if: always()
        run: grep -rhs '^::warning ' "$CASSINI_TEST_LOGS" --include=testlog.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: meson-logs-deb-${{ strategy.job-index }}
          path: ${{ runner.temp }}/meson-logs/
          retention-days: 14
          if-no-files-found: warn
      # Preserve built packages even if a subsequent installed-app journey
      # fails; release selection still requires every gate on main to pass.
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ strategy.job-index }}
          path: dist/*.deb
      # C (D66): the harness images of tests/harness-image.sh, from a cache main
      # saves and pull requests only read; their key changes every week and with
      # every input. run.sh builds an image the cache did not hold.
      - name: Harness image cache key
        id: harness
        if: matrix.base == 'ubuntu:26.04'
        run: build-aux/ci/harness-cache.sh key build-refresh browser-setup >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: harness-cache
        if: matrix.base == 'ubuntu:26.04'
        with:
          path: ${{ steps.harness.outputs.path }}
          key: ${{ steps.harness.outputs.key }}
      - name: Load the cached harness images
        if: matrix.base == 'ubuntu:26.04' && steps.harness-cache.outputs.cache-hit == 'true'
        run: build-aux/ci/harness-cache.sh load "${{ steps.harness.outputs.path }}"
      - name: Installed package restarts after upgrades and preserves active audio
        if: matrix.base == 'ubuntu:26.04'
        run: tests/build-refresh/run.sh dist/cassini-talk_*.deb "$RUNNER_TEMP/build-refresh"
      - uses: actions/upload-artifact@v7
        if: always() && matrix.base == 'ubuntu:26.04'
        with:
          name: installed-build-refresh
          path: |
            ${{ runner.temp }}/build-refresh/*.json
            ${{ runner.temp }}/build-refresh/*.log
            ${{ runner.temp }}/build-refresh/*.png
      - uses: actions/setup-node@v7
        if: matrix.base == 'ubuntu:26.04'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/recording/package-lock.json
      - uses: actions/cache@v6
        if: matrix.base == 'ubuntu:26.04'
        with:
          path: ~/.cache/ms-playwright
          key: browser-startup-linux-x64-${{ hashFiles('tests/recording/package-lock.json') }}
      - name: Prepare the pinned browser startup harness
        if: matrix.base == 'ubuntu:26.04'
        run: |
          npm ci --prefix tests/recording
          tests/recording/node_modules/.bin/playwright install chromium
      - name: Installed package connects a fresh real extension without Connect
        if: matrix.base == 'ubuntu:26.04'
        run: tests/browser-setup/run.sh dist/cassini-talk_*.deb "$RUNNER_TEMP/browser-startup"
      - uses: actions/upload-artifact@v7
        if: always() && matrix.base == 'ubuntu:26.04'
        with:
          name: browser-startup-installed
          path: ${{ runner.temp }}/browser-startup/
      - name: Save the harness images (main only)
        if: matrix.base == 'ubuntu:26.04' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.harness-cache.outputs.cache-hit != 'true'
        run: build-aux/ci/harness-cache.sh save "${{ steps.harness.outputs.path }}" build-refresh browser-setup
      - uses: actions/cache/save@v6
        if: matrix.base == 'ubuntu:26.04' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.harness-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.harness.outputs.path }}
          key: ${{ steps.harness.outputs.key }}
