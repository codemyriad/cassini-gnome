name: Debian package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build .deb (${{ matrix.base }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: ["ubuntu:26.04"]
    container: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential devscripts equivs lintian
          mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control
      - name: Build
        run: dpkg-buildpackage -us -uc -b
      - name: Lintian
        run: lintian --info --fail-on error ../*.deb
      - name: Install and smoke-test
        run: |
          apt-get install -y --no-install-recommends ../*.deb
          python3 -c "import sys; sys.path.insert(0, '/usr/share/cassini-viewer'); import cassini_viewer.portable"
          test -x /usr/bin/cassini-viewer
      - name: Collect
        run: mkdir -p dist && cp ../*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ strategy.job-index }}
          path: dist/*.deb
