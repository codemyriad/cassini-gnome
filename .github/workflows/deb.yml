name: Debian package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The runners have both; build.sh would pick podman, but rootful docker is
# what it is tested with.
env:
  CONTAINER_ENGINE: docker

jobs:
  build:
    name: Build .deb (${{ matrix.base }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only the Ubuntu build is released; a Debian testing breakage should
    # show up in CI without blocking a release.
    continue-on-error: ${{ matrix.base != 'ubuntu:26.04' }}
    strategy:
      fail-fast: false
      matrix:
        base: ["ubuntu:26.04", "debian:testing"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: echo "CASSINI_PARAKEET_TEST_CACHE=$RUNNER_TEMP/parakeet-models" >> "$GITHUB_ENV"
      # The pinned writing-down artifacts (whistle/pins.json), downloaded once
      # per pin set; the package builds read them and never download.
      - uses: actions/cache@v6
        with:
          path: .whistle-cache
          key: whistle-${{ hashFiles('whistle/pins.json') }}
      - uses: actions/cache@v6
        with:
          path: .sherpa-cache
          key: sherpa-${{ hashFiles('src/cassini_talk/sherpa-pins.json') }}
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/parakeet-models
          key: parakeet-ultra-18cb623004dd6c15999b93cb70b14d8a1f6e8f3a2a97ff733f104bfc3494f6a9
      - run: build-aux/whistle-cache.sh
      # The same script as `make deb`: checks the version, builds, runs
      # lintian, installs the package in a fresh container and, with no
      # network, smoke-tests it and writes the D11 goldens down with it.
      # Retried once because distribution mirrors occasionally time out.
      - run: build-aux/deb/build.sh "${{ matrix.base }}" || build-aux/deb/build.sh "${{ matrix.base }}"
      # Preserve built packages even if a subsequent installed-app journey
      # fails; release selection still requires every gate on main to pass.
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ strategy.job-index }}
          path: dist/*.deb
      - name: Installed package restarts after upgrades and preserves active audio
        if: matrix.base == 'ubuntu:26.04'
        run: tests/build-refresh/run.sh dist/cassini-talk_*.deb "$RUNNER_TEMP/build-refresh"
      - uses: actions/upload-artifact@v7
        if: always() && matrix.base == 'ubuntu:26.04'
        with:
          name: installed-build-refresh
          path: |
            ${{ runner.temp }}/build-refresh/*.json
            ${{ runner.temp }}/build-refresh/*.log
            ${{ runner.temp }}/build-refresh/*.png
      - uses: actions/setup-node@v7
        if: matrix.base == 'ubuntu:26.04'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/recording/package-lock.json
      - uses: actions/cache@v6
        if: matrix.base == 'ubuntu:26.04'
        with:
          path: ~/.cache/ms-playwright
          key: browser-startup-linux-x64-${{ hashFiles('tests/recording/package-lock.json') }}
      - name: Prepare the pinned browser startup harness
        if: matrix.base == 'ubuntu:26.04'
        run: |
          npm ci --prefix tests/recording
          tests/recording/node_modules/.bin/playwright install chromium
      - name: Installed package connects a fresh real extension without Connect
        if: matrix.base == 'ubuntu:26.04'
        run: tests/browser-setup/run.sh dist/cassini-talk_*.deb "$RUNNER_TEMP/browser-startup"
      - uses: actions/upload-artifact@v7
        if: always() && matrix.base == 'ubuntu:26.04'
        with:
          name: browser-startup-installed
          path: ${{ runner.temp }}/browser-startup/
