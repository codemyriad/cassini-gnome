name: Exact transcript renderer
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "29 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exact-transcript-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CASSINI_PERF_GATE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '1' || '' }}
jobs:
  native-gtk:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CM_RUNNER_DESKTOP == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-26.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install native GTK test dependencies
        run: |
          sudo build-aux/ci/apt-install-bounded.sh python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 gir1.2-atspi-2.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good libglib2.0-dev-bin xvfb xauth xdotool dbus-x11 at-spi2-core fonts-cantarell fonts-inter fontconfig locales
          sudo locale-gen en_GB.UTF-8
      - name: Compile resources and schemas
        run: |
          mkdir -p _exact-build _exact-schemas exact-results
          glib-compile-resources --sourcedir=src src/cassini-talk.gresource.xml --target=_exact-build/cassini-talk.gresource
          cp data/io.codemyriad.CassiniTalk.gschema.xml _exact-schemas/
          glib-compile-schemas _exact-schemas
      - name: ListView memory baseline and exact renderer parity and budgets
        env:
          CASSINI_CUSTOM_BUILD: ${{ github.workspace }}/_exact-build
          GSETTINGS_SCHEMA_DIR: ${{ github.workspace }}/_exact-schemas
          CASSINI_RUN_TIMEOUT: "900"
        run: |
          if [ "${CASSINI_PERF_GATE:-}" = "1" ]; then
            CASSINI_TRANSCRIPT_RENDER=listview CASSINI_CUSTOM_OUT="$PWD/exact-results/listview.json" build-aux/ux-screenshot.sh tests/ui/exact-transcript.py exact-results/listview.png
          fi
          CASSINI_CUSTOM_OUT="$PWD/exact-results/exact.json" build-aux/ux-screenshot.sh tests/ui/exact-transcript.py exact-results/exact.png
          if [ "${CASSINI_PERF_GATE:-}" = "1" ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          baseline = {r['name']: r for r in json.loads(Path('exact-results/listview.json').read_text())}
          for row in json.loads(Path('exact-results/exact.json').read_text()):
              delta = row['rssMiB'] - baseline[row['name']]['rssMiB']
              assert delta <= 20, (row['name'], 'RSS overhead MiB', delta)
          PY
          fi
      - name: Standalone default reader search, word seek and native scroll
        env:
          CASSINI_CUSTOM_BUILD: ${{ github.workspace }}/_exact-build
          GSETTINGS_SCHEMA_DIR: ${{ github.workspace }}/_exact-schemas
        run: build-aux/ux-screenshot.sh tests/ui/exact-reader.py exact-results/reader.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: exact-transcript-measurements
          path: exact-results/
