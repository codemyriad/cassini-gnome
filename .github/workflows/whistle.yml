name: Offline transcription pipeline
on:
  workflow_call:
    inputs:
      product:
        type: string
        default: ""
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-offline-recognition:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CM_RUNNER_DESKTOP == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-26.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install build-only dependencies for standalone dispatch
        if: inputs.product == ''
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::Retries::Delay=true -o Acquire::Retries::Delay::Maximum=5 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::Retries::Delay=true -o Acquire::Retries::Delay::Maximum=5 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o APT::Update::Error-Mode=any install -y python3 meson ninja-build gcc libc6-dev gettext libglib2.0-bin libglib2.0-dev-bin desktop-file-utils appstream
      - uses: actions/cache@v6
        if: inputs.product == ''
        with:
          path: .whistle-cache
          key: whistle-${{ hashFiles('whistle/pins.json') }}
      - name: Fetch and verify exact build-time artifacts
        if: inputs.product == ''
        run: |
          CASSINI_WHISTLE_CACHE=.whistle-cache build-aux/whistle-cache.sh
          CASSINI_WHISTLE_CACHE=.whistle-cache build-aux/whistle-cache.sh
      - uses: actions/cache@v6
        if: inputs.product == ''
        with:
          path: .sherpa-cache
          key: sherpa-${{ hashFiles('src/cassini_talk/sherpa-pins.json') }}
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/parakeet-models
          key: parakeet-ultra-v2-50c15b94ea9cb1c2f8dbcdcbc0f15b450169154deeb206923cb5388f60892366
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nemotron-models
          key: nemotron-${{ hashFiles('src/cassini_talk/models.json') }}
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/voice-models
          key: campplus-357a834f702b80161e5b981182c038e18553c1f2ca752ed6cec2052365d4129b
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/diarization-fixtures
          key: s11-audio-${{ hashFiles('tests/ux/diarization/fetch-pins.json') }}
      - name: Prepare pinned D24 model and reproducible S-11 input
        run: |
          python3 tests/diarization/prepare_model.py --cache "$RUNNER_TEMP/nemotron-models"
          python3 tests/ux/diarization/build.py --cache "$RUNNER_TEMP/diarization-fixtures" --output "$RUNNER_TEMP/diarization-input.wav"
      - name: Prepare pinned D25 speaker embedding model
        run: python3 tests/voices/prepare_model.py --cache "$RUNNER_TEMP/voice-models"
      - name: Prepare pinned D16 runtime for standalone dispatch
        if: inputs.product == ''
        run: CASSINI_SHERPA_CACHE=.sherpa-cache build-aux/sherpa-cache.sh
      - name: Prepare pinned golden fixture
        run: python3 tests/parakeet/prepare_model.py --cache "$RUNNER_TEMP/parakeet-models"
      - name: Build and stage the app with the bundle for standalone dispatch
        if: inputs.product == ''
        run: |
          meson setup _build --prefix=/usr --libdir=lib/x86_64-linux-gnu -Dwhistle=enabled -Dwhistle_cache="$PWD/.whistle-cache" -Dsherpa=enabled -Dsherpa_cache="$PWD/.sherpa-cache"
          DESTDIR=$PWD/_stage meson install -C _build
          echo "OFFLINE_STAGE=$PWD/_stage" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        if: inputs.product != ''
        with:
          name: ${{ inputs.product }}
          path: _ci-download
      - name: Use exact bundled-engine build product
        if: inputs.product != ''
        run: |
          python3 build-aux/ci/product.py unpack _ci-offline _ci-download/offline.tar --commit "$GITHUB_SHA" --profile offline
          echo "OFFLINE_STAGE=$PWD/_ci-offline/install" >> "$GITHUB_ENV"
      # C (D66): the harness images of tests/harness-image.sh, from a cache main
      # saves and pull requests only read; their key changes every week and with
      # every input. run.sh builds an image the cache did not hold.
      - name: Harness image cache key
        id: harness
        run: build-aux/ci/harness-cache.sh key whistle >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: harness-cache
        with:
          path: ${{ steps.harness.outputs.path }}
          key: ${{ steps.harness.outputs.key }}
      - name: Load the cached harness images
        if: steps.harness-cache.outputs.cache-hit == 'true'
        run: build-aux/ci/harness-cache.sh load "${{ steps.harness.outputs.path }}"
      - name: Refresh the offline harness once against the current archive
        run: |
          harness=$(tests/harness-image.sh tag whistle)
          if ! docker image inspect "$harness" >/dev/null 2>&1; then
            base=$(tests/harness-image.sh base whistle)
            build-aux/ci/docker-build-bounded.sh "offline cached harness" docker build --pull --progress=plain --target harness --build-arg BASE="$base" -t "$harness" - < tests/whistle/Containerfile
          fi
          offline_job="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          image=$(tests/whistle/refresh-image.sh build "$harness" "$offline_job")
          echo "CASSINI_OFFLINE_HARNESS_IMAGE=$image" >> "$GITHUB_ENV"
          echo "CASSINI_OFFLINE_HARNESS_JOB=$offline_job" >> "$GITHUB_ENV"
      - name: Native constructor guard, both goldens and real GTK queue without network
        run: tests/whistle/run.sh "$OFFLINE_STAGE/usr/share/cassini-talk/whistle" "$PWD/whistle-artifacts" "$OFFLINE_STAGE"
      - name: Both Parakeet goldens and ABI through isolated per-job workers
        run: tests/parakeet/run.sh "$OFFLINE_STAGE/usr/share/cassini-talk/whistle" "$RUNNER_TEMP/parakeet-models/parakeet-ultra-0.6b-int8-v2/50c15b94ea9cb1c2f8dbcdcbc0f15b450169154deeb206923cb5388f60892366" "$OFFLINE_STAGE/usr/lib/x86_64-linux-gnu/cassini-talk/sherpa" "$PWD/parakeet-artifacts"
      - name: D24 installed worker, S-11 golden and production queue reuse
        run: tests/diarization/run.sh "$OFFLINE_STAGE/usr/share/cassini-talk/whistle" "$RUNNER_TEMP/nemotron-models" "$RUNNER_TEMP/diarization-input.wav" "$PWD/diarization-artifacts" "$OFFLINE_STAGE" "$RUNNER_TEMP/parakeet-models/parakeet-ultra-0.6b-int8-v2/50c15b94ea9cb1c2f8dbcdcbc0f15b450169154deeb206923cb5388f60892366"
      - name: D25 installed extractor, S-9 vectors and model comparisons without network
        run: tests/voices/run.sh "$OFFLINE_STAGE/usr/share/cassini-talk/whistle" "$RUNNER_TEMP/voice-models" "$RUNNER_TEMP/diarization-input.wav" "$PWD/voice-artifacts" "$OFFLINE_STAGE" "$RUNNER_TEMP/nemotron-models" "$RUNNER_TEMP/parakeet-models/parakeet-ultra-0.6b-int8-v2/50c15b94ea9cb1c2f8dbcdcbc0f15b450169154deeb206923cb5388f60892366"
      - name: Remove only this job's refreshed harness image
        if: always() && env.CASSINI_OFFLINE_HARNESS_IMAGE != ''
        run: tests/whistle/refresh-image.sh remove "$CASSINI_OFFLINE_HARNESS_IMAGE" "$CASSINI_OFFLINE_HARNESS_JOB"
      - name: Save the harness images (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.harness-cache.outputs.cache-hit != 'true'
        run: build-aux/ci/harness-cache.sh save "${{ steps.harness.outputs.path }}" whistle
      - uses: actions/cache/save@v6
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.harness-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.harness.outputs.path }}
          key: ${{ steps.harness.outputs.key }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: voices-linux-x86_64
          path: voice-artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diarization-linux-x86_64
          path: diarization-artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parakeet-linux-x86_64
          path: parakeet-artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: whistle-linux-x86_64
          path: whistle-artifacts/
          retention-days: 14
