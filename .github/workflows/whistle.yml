name: Offline transcription pipeline
on:
  pull_request:
    paths:
      - 'whistle/**'
      - 'meson.build'
      - 'meson_options.txt'
      - 'src/cassini_viewer/whistle_*.py'
      - 'src/cassini_viewer/speech_pipeline.py'
      - 'src/cassini_viewer/opus_input.py'
      - 'src/cassini_viewer/fir-48k-16k.json'
      - 'src/cassini_viewer/transcription.py'
      - 'src/cassini_viewer/transcript_publish.py'
      - 'src/cassini_viewer/meeting_store.py'
      - 'src/cassini_viewer/meeting*.py'
      - 'src/cassini_viewer/library*.py'
      - 'src/cassini_viewer/main.py'
      - 'src/cassini_viewer/strings.json'
      - 'src/cassini_viewer/meeting.schema.json'
      - 'src/cassini_viewer/recording_session.py'
      - 'tests/whistle/**'
      - 'tests/test_whistle_spike.py'
      - '.github/workflows/whistle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-offline-recognition:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install build-only dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 meson ninja-build gcc libc6-dev gettext libglib2.0-bin libglib2.0-dev-bin desktop-file-utils appstream
      - uses: actions/cache@v4
        with:
          path: /tmp/whistle-cache
          key: whistle-${{ hashFiles('whistle/pins.json') }}
      - name: Fetch and verify exact build-time artifacts
        run: |
          CASSINI_WHISTLE_CACHE=/tmp/whistle-cache build-aux/whistle-cache.sh
          CASSINI_WHISTLE_CACHE=/tmp/whistle-cache build-aux/whistle-cache.sh
      - name: Build and stage the app with the bundle, offline
        run: |
          meson setup _build --prefix=/usr -Dwhistle=enabled -Dwhistle_cache=/tmp/whistle-cache
          DESTDIR=$PWD/_stage meson install -C _build
      - name: Native constructor guard, both goldens and real GTK queue without network
        run: tests/whistle/run.sh "$PWD/_stage/usr/share/cassini-viewer/whistle" "$PWD/whistle-artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whistle-linux-x86_64
          path: whistle-artifacts/
          retention-days: 14
