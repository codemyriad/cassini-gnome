name: Offline transcription pipeline
on:
  workflow_call:
    inputs:
      product:
        type: string
        default: ""
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-offline-recognition:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install build-only dependencies for standalone dispatch
        if: inputs.product == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 meson ninja-build gcc libc6-dev gettext libglib2.0-bin libglib2.0-dev-bin desktop-file-utils appstream
      - uses: actions/cache@v4
        if: inputs.product == ''
        with:
          path: .whistle-cache
          key: whistle-${{ hashFiles('whistle/pins.json') }}
      - name: Fetch and verify exact build-time artifacts
        if: inputs.product == ''
        run: |
          CASSINI_WHISTLE_CACHE=.whistle-cache build-aux/whistle-cache.sh
          CASSINI_WHISTLE_CACHE=.whistle-cache build-aux/whistle-cache.sh
      - uses: actions/cache@v4
        if: inputs.product == ''
        with:
          path: .sherpa-cache
          key: sherpa-${{ hashFiles('src/cassini_viewer/sherpa-pins.json') }}
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/parakeet-models
          key: parakeet-ultra-18cb623004dd6c15999b93cb70b14d8a1f6e8f3a2a97ff733f104bfc3494f6a9
      - name: Prepare pinned D16 runtime for standalone dispatch
        if: inputs.product == ''
        run: CASSINI_SHERPA_CACHE=.sherpa-cache build-aux/sherpa-cache.sh
      - name: Prepare pinned golden fixture
        run: python3 tests/parakeet/prepare_model.py --cache "$RUNNER_TEMP/parakeet-models"
      - name: Build and stage the app with the bundle for standalone dispatch
        if: inputs.product == ''
        run: |
          meson setup _build --prefix=/usr --libdir=lib/x86_64-linux-gnu -Dwhistle=enabled -Dwhistle_cache="$PWD/.whistle-cache" -Dsherpa=enabled -Dsherpa_cache="$PWD/.sherpa-cache"
          DESTDIR=$PWD/_stage meson install -C _build
          echo "OFFLINE_STAGE=$PWD/_stage" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v5
        if: inputs.product != ''
        with:
          name: ${{ inputs.product }}
          path: _ci-download
      - name: Use exact bundled-engine build product
        if: inputs.product != ''
        run: |
          python3 build-aux/ci/product.py unpack _ci-offline _ci-download/offline.tar --commit "$GITHUB_SHA" --profile offline
          echo "OFFLINE_STAGE=$PWD/_ci-offline/install" >> "$GITHUB_ENV"
      - name: Native constructor guard, both goldens and real GTK queue without network
        run: tests/whistle/run.sh "$OFFLINE_STAGE/usr/share/cassini-viewer/whistle" "$PWD/whistle-artifacts" "$OFFLINE_STAGE"
      - name: Both Parakeet goldens and ABI through isolated per-job workers
        run: tests/parakeet/run.sh "$OFFLINE_STAGE/usr/share/cassini-viewer/whistle" "$RUNNER_TEMP/parakeet-models/parakeet-ultra-0.6b-int8/18cb623004dd6c15999b93cb70b14d8a1f6e8f3a2a97ff733f104bfc3494f6a9" "$OFFLINE_STAGE/usr/lib/x86_64-linux-gnu/cassini-viewer/sherpa" "$PWD/parakeet-artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parakeet-linux-x86_64
          path: parakeet-artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whistle-linux-x86_64
          path: whistle-artifacts/
          retention-days: 14
