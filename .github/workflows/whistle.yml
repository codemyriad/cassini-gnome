name: Offline transcription pipeline
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'meson.build'
      - 'meson_options.txt'
      - 'data/**'
      - 'build-aux/ci/**'
      - 'pyproject.toml'
      - 'whistle/**'
      - 'sherpa/**'
      - 'src/cassini_viewer/parakeet*.py'
      - 'src/cassini_viewer/speech_models.py'
      - 'tests/test_speech_models.py'
      - 'src/cassini_viewer/sherpa*'
      - 'tests/parakeet/**'
      - 'tests/test_parakeet.py'
      - 'build-aux/sherpa-cache.sh'
      - 'src/cassini_viewer/whistle_*.py'
      - 'src/cassini_viewer/speech_pipeline.py'
      - 'src/cassini_viewer/opus_input.py'
      - 'src/cassini_viewer/export*.py'
      - 'src/cassini_viewer/portable_writer.py'
      - 'src/cassini_viewer/portable_context.py'
      - 'src/cassini_viewer/received.py'
      - 'src/cassini_viewer/fir-48k-16k.json'
      - 'src/cassini_viewer/transcription.py'
      - 'src/cassini_viewer/transcript_publish.py'
      - 'src/cassini_viewer/meeting_store.py'
      - 'src/cassini_viewer/meeting*.py'
      - 'src/cassini_viewer/library*.py'
      - 'src/cassini_viewer/main.py'
      - 'src/cassini_viewer/strings.json'
      - 'src/cassini_viewer/meeting.schema.json'
      - 'src/cassini_viewer/recording_session.py'
      - 'tests/whistle/**'
      - 'tests/test_whistle_spike.py'
      - '.github/workflows/whistle.yml'
  schedule:
    - cron: "31 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-offline-recognition:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install build-only dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 meson ninja-build gcc libc6-dev gettext libglib2.0-bin libglib2.0-dev-bin desktop-file-utils appstream
      - uses: actions/cache@v4
        with:
          path: .whistle-cache
          key: whistle-${{ hashFiles('whistle/pins.json') }}
      - name: Fetch and verify exact build-time artifacts
        run: |
          CASSINI_WHISTLE_CACHE=.whistle-cache build-aux/whistle-cache.sh
          CASSINI_WHISTLE_CACHE=.whistle-cache build-aux/whistle-cache.sh
      - uses: actions/cache@v4
        with:
          path: .sherpa-cache
          key: sherpa-${{ hashFiles('src/cassini_viewer/sherpa-pins.json') }}
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/parakeet-models
          key: parakeet-ultra-18cb623004dd6c15999b93cb70b14d8a1f6e8f3a2a97ff733f104bfc3494f6a9
      - name: Prepare pinned D16 runtime and golden fixture
        run: |
          CASSINI_SHERPA_CACHE=.sherpa-cache build-aux/sherpa-cache.sh
          python3 tests/parakeet/prepare_model.py --cache "$RUNNER_TEMP/parakeet-models"
      - name: Build and stage the app with the bundle, offline
        run: |
          meson setup _build --prefix=/usr -Dwhistle=enabled -Dwhistle_cache="$PWD/.whistle-cache" -Dsherpa=enabled -Dsherpa_cache="$PWD/.sherpa-cache"
          DESTDIR=$PWD/_stage meson install -C _build
      - name: Native constructor guard, both goldens and real GTK queue without network
        run: tests/whistle/run.sh "$PWD/_stage/usr/share/cassini-viewer/whistle" "$PWD/whistle-artifacts"
      - name: Both Parakeet goldens and ABI through isolated per-job workers
        run: tests/parakeet/run.sh "$PWD/_stage/usr/share/cassini-viewer/whistle" "$RUNNER_TEMP/parakeet-models/parakeet-ultra-0.6b-int8/18cb623004dd6c15999b93cb70b14d8a1f6e8f3a2a97ff733f104bfc3494f6a9" "$PWD/_stage/usr/lib/x86_64-linux-gnu/cassini-viewer/sherpa" "$PWD/parakeet-artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parakeet-linux-x86_64
          path: parakeet-artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whistle-linux-x86_64
          path: whistle-artifacts/
          retention-days: 14
