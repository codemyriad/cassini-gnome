name: Source checks
on:
  workflow_call:
    inputs:
      deb_testing:
        type: boolean
        default: true
      rpm_opensuse:
        type: boolean
        default: true
      arch:
        type: boolean
        default: true
      extra_distros:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      deb_testing:
        description: Include debian:testing (delegated to Debian package)
        type: boolean
        default: true
      rpm_opensuse:
        description: Include openSUSE Tumbleweed (delegated to RPM and Arch packages)
        type: boolean
        default: true
      arch:
        description: Include Arch Linux (delegated to RPM and Arch packages)
        type: boolean
        default: true
      extra_distros:
        description: Run fedora:latest and alpine:edge instead of fedora:44
        type: boolean
        default: true
permissions:
  contents: read
env:
  CONTAINER_ENGINE: docker
  CASSINI_PERF_GATE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '1' || '' }}
jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CM_RUNNER == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff pytest
      - run: ruff check src tests build-aux/ci
      - run: ruff format --check src tests build-aux/ci
      # G16: the release metadata check runs on every PR here (Lint always
      # runs), not in its own path-filtered workflow. It creates no tag.
      - name: Check every package version and the proposed tag name without creating it
        run: |
          version=$(sed -n "s/^ *version: *'\([^']*\)'.*/\1/p" meson.build | head -n1)
          python3 build-aux/ci/release_metadata.py --tag "v$version" --report "$RUNNER_TEMP/release-metadata.json"
      - name: Install system Python audio test dependencies
        run: |
          sudo build-aux/ci/apt-install-bounded.sh gcc libc6-dev python3-pytest python3-jsonschema python3-rfc3339-validator python3-gi gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Require the approved native ABI layout check
        run: |
          command -v cc
          /usr/bin/python3 -m pytest -q tests/test_parakeet.py::test_all_used_struct_sizes_and_every_field_offset_match_the_approved_fork_header
      # The full suite is not run here (G9): Debian package runs it on every PR
      # in the same Ubuntu 26.04 image (gated by check_pytest_ran.py), Recording
      # runs the host perf-gate suite on nightly/dispatch/full-ci, and alpine:edge
      # covers the no-NumPy path.

  distros:
    name: Build and test on ${{ matrix.image }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CM_RUNNER == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-26.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # G11 (D66 rule 5, D20): the pytest suite is skipped only where
        # `pytest-in` names a package job that runs the identical suite in the
        # identical image; its recipe sets CASSINI_TEST_REQUIRE_GTK, so its
        # check fails rather than skips the GTK application tests. PR and main
        # pushes gate on ubuntu:26.04 (skipping to deb) plus fedora:44 (keeping
        # the non-package reference pytest run), adding any packaging legs whose
        # inputs changed on the PR; full-ci and dispatch runs cover all six on
        # pinned digests, while nightly schedule runs probe the rolling legs on
        # unpinned tags outside merge and release gates.
        include: ${{ fromJSON(format('[{{"image":"ubuntu:26.04@sha256:065aa8626841f16057b78b027b464cd59c4fac36c204c72dcbf48d66f5fa8a96","pytest-in":"Debian package / Build .deb (ubuntu:26.04@sha256:065aa8626841f16057b78b027b464cd59c4fac36c204c72dcbf48d66f5fa8a96)"}},{0}{1}{2}{3}]', inputs.extra_distros && (github.event_name == 'schedule' && '{"image":"fedora:latest"},{"image":"alpine:edge"}' || '{"image":"fedora:latest@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c"},{"image":"alpine:edge@sha256:020dfcbaaf4cc1078bf2d9c7ba31a8466e334061dcd2f248001d68f79e52c000"}') || '{"image":"fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e"}', inputs.deb_testing && (github.event_name == 'schedule' && ',{"image":"debian:testing","pytest-in":"Debian package / Build .deb (debian:testing)"}' || ',{"image":"debian:testing@sha256:2d46f43b677a047cfab870549eea0d83d0a9bea2f55b3f481efc901043916c2a","pytest-in":"Debian package / Build .deb (debian:testing@sha256:2d46f43b677a047cfab870549eea0d83d0a9bea2f55b3f481efc901043916c2a)"}') || '', inputs.rpm_opensuse && (github.event_name == 'schedule' && ',{"image":"registry.opensuse.org/opensuse/tumbleweed:latest","pytest-in":"RPM and Arch packages / Build .rpm (registry.opensuse.org/opensuse/tumbleweed:latest)"}' || ',{"image":"registry.opensuse.org/opensuse/tumbleweed:latest@sha256:27356084647aa08ad9e9c5e0ebfd2742f9f65279860e862b3a65148450c113da","pytest-in":"RPM and Arch packages / Build .rpm (registry.opensuse.org/opensuse/tumbleweed:latest@sha256:27356084647aa08ad9e9c5e0ebfd2742f9f65279860e862b3a65148450c113da)"}') || '', inputs.arch && (github.event_name == 'schedule' && ',{"image":"archlinux:latest","pytest-in":"RPM and Arch packages / Build Arch package"}' || ',{"image":"archlinux:latest@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899","pytest-in":"RPM and Arch packages / Build Arch package"}') || '')) }}
    env:
      CASSINI_SKIP_PYTEST: ${{ matrix.pytest-in && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo "CASSINI_TEST_LOGS=$RUNNER_TEMP/meson-logs" >> "$GITHUB_ENV"
          echo "CASSINI_INSTALL_OUTCOME=$RUNNER_TEMP/install-outcome" >> "$GITHUB_ENV"
      - name: Name the job that runs this image's pytest suite
        if: matrix.pytest-in
        run: echo "::notice::pytest suite skipped here; ${{ matrix.pytest-in }} runs it in ${{ matrix.image }}"
      # Run once (D66): the script retries only its package installs and
      # image pulls (build-aux/ci/retry.sh), never the build or its tests.
      - run: build-aux/check-distros.sh "${{ matrix.image }}"
      # G11: from this job's own Meson logs, the node ids its pytest ran
      # (fedora:latest's are the reference every package job must cover),
      # or, whatever made it skip, a pytest-skipped marker that CI's Pytest
      # coverage gate requires a package job's proof for. Only run after
      # check-distros.sh succeeds so a failure before pytest never uploads a
      # skip marker; suffix run_attempt so re-runs supersede stale markers.
      - name: Record which pytest tests ran here
        id: pytest
        run: |
          . build-aux/container.sh
          python3 build-aux/ci/check_pytest_ran.py --source "$CASSINI_TEST_LOGS" \
            --install-outcome "$CASSINI_INSTALL_OUTCOME" --slug "$(image_slug "${{ matrix.image }}")" \
            --export "$RUNNER_TEMP/pytest" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: pytest-${{ steps.pytest.outputs.kind }}-${{ steps.pytest.outputs.slug }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pytest/
          if-no-files-found: error
      # G3: the Meson test logs (testlog.txt with each shard's --durations,
      # testlog.json, the pytest junit XML), also on success outside pull
      # requests to track creep (on pull requests, uploaded on failure);
      # a shard over half its timeout becomes a warning annotation here.
      - name: Warn about pytest shards over half their budget
        if: always()
        run: grep -rhs '^::warning ' "$CASSINI_TEST_LOGS" --include=testlog.txt || true
      - uses: actions/upload-artifact@v7
        if: ${{ failure() || (github.event_name != 'pull_request' && always()) }}
        with:
          name: meson-logs-distro-${{ strategy.job-index }}
          path: ${{ runner.temp }}/meson-logs/
          retention-days: 14
          if-no-files-found: warn

