name: Source checks
on:
  workflow_call:
    inputs:
      full_ci:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      full_ci:
        description: Run all six distribution containers (otherwise Ubuntu 26.04 + Fedora 44)
        type: boolean
        default: true
permissions:
  contents: read
env:
  CONTAINER_ENGINE: docker
jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CM_RUNNER == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff pytest
      - run: ruff check src tests build-aux/ci
      - run: ruff format --check src tests build-aux/ci
      # G16: the release metadata check runs on every PR here (Lint always
      # runs), not in its own path-filtered workflow. It creates no tag.
      - name: Check every package version and the proposed tag name without creating it
        run: |
          version=$(sed -n "s/^ *version: *'\([^']*\)'.*/\1/p" meson.build | head -n1)
          python3 build-aux/ci/release_metadata.py --tag "v$version" --report "$RUNNER_TEMP/release-metadata.json"
      - name: Install system Python audio test dependencies
        run: |
          sudo build-aux/ci/apt-install-bounded.sh gcc libc6-dev python3-pytest python3-jsonschema python3-rfc3339-validator python3-gi gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Require the approved native ABI layout check
        run: |
          command -v cc
          /usr/bin/python3 -m pytest -q tests/test_parakeet.py::test_all_used_struct_sizes_and_every_field_offset_match_the_approved_fork_header
      # The full suite is not run here (G9): Recording runs it on every PR in a
      # superset of this environment on the same image, and alpine:edge covers
      # the no-NumPy path.

  distros:
    name: Build and test on ${{ matrix.image }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CM_RUNNER == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-26.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # G11 (D66 rule 5, D20): the pytest suite is skipped only where
        # `pytest-in` names a package job that runs the identical suite in the
        # identical image; its recipe sets CASSINI_TEST_REQUIRE_GTK, so its
        # check fails rather than skips the GTK application tests. PR and main
        # pushes gate on ubuntu:26.04 (skipping to deb) plus fedora:44 (keeping
        # the non-package reference pytest run); nightly and full-ci runs cover
        # all six distribution images.
        include: ${{ inputs.full_ci && fromJSON('[{"image":"debian:testing","pytest-in":"Debian package / Build .deb (debian:testing)"},{"image":"ubuntu:26.04","pytest-in":"Debian package / Build .deb (ubuntu:26.04)"},{"image":"fedora:latest"},{"image":"registry.opensuse.org/opensuse/tumbleweed:latest","pytest-in":"RPM and Arch packages / Build .rpm (registry.opensuse.org/opensuse/tumbleweed:latest)"},{"image":"archlinux:latest","pytest-in":"RPM and Arch packages / Build Arch package"},{"image":"alpine:edge"}]') || fromJSON('[{"image":"ubuntu:26.04","pytest-in":"Debian package / Build .deb (ubuntu:26.04)"},{"image":"fedora:44"}]') }}
    env:
      CASSINI_SKIP_PYTEST: ${{ matrix.pytest-in && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo "CASSINI_TEST_LOGS=$RUNNER_TEMP/meson-logs" >> "$GITHUB_ENV"
          echo "CASSINI_INSTALL_OUTCOME=$RUNNER_TEMP/install-outcome" >> "$GITHUB_ENV"
      - name: Name the job that runs this image's pytest suite
        if: matrix.pytest-in
        run: echo "::notice::pytest suite skipped here; ${{ matrix.pytest-in }} runs it in ${{ matrix.image }}"
      # Run once (D66): the script retries only its package installs and
      # image pulls (build-aux/ci/retry.sh), never the build or its tests.
      - run: build-aux/check-distros.sh "${{ matrix.image }}"
      # G11: from this job's own Meson logs, the node ids its pytest ran
      # (fedora:latest's are the reference every package job must cover),
      # or, whatever made it skip, a pytest-skipped marker that CI's Pytest
      # coverage gate requires a package job's proof for. Only run after
      # check-distros.sh succeeds so a failure before pytest never uploads a
      # skip marker; suffix run_attempt so re-runs supersede stale markers.
      - name: Record which pytest tests ran here
        id: pytest
        run: |
          . build-aux/container.sh
          python3 build-aux/ci/check_pytest_ran.py --source "$CASSINI_TEST_LOGS" \
            --install-outcome "$CASSINI_INSTALL_OUTCOME" --slug "$(image_slug "${{ matrix.image }}")" \
            --export "$RUNNER_TEMP/pytest" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: pytest-${{ steps.pytest.outputs.kind }}-${{ steps.pytest.outputs.slug }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pytest/
          if-no-files-found: error
      # G3: the Meson test logs (testlog.txt with each shard's --durations,
      # testlog.json, the pytest junit XML), also on success, to track creep;
      # a shard over half its timeout becomes a warning annotation here.
      - name: Warn about pytest shards over half their budget
        if: always()
        run: grep -rhs '^::warning ' "$CASSINI_TEST_LOGS" --include=testlog.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: meson-logs-distro-${{ strategy.job-index }}
          path: ${{ runner.temp }}/meson-logs/
          retention-days: 14
          if-no-files-found: warn

