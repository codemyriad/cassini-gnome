name: Source checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
env:
  CONTAINER_ENGINE: docker
jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff pytest
      - run: ruff check src tests build-aux/ci
      - run: ruff format --check src tests build-aux/ci
      - name: Install system Python audio test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev python3-pytest python3-jsonschema python3-rfc3339-validator python3-gi gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Require the approved native ABI layout check
        run: |
          command -v cc
          /usr/bin/python3 -m pytest -q tests/test_parakeet.py::test_all_used_struct_sizes_and_every_field_offset_match_the_approved_fork_header
      # The full suite is not run here (G9): Recording runs it on every PR in a
      # superset of this environment on the same image, and alpine:edge covers
      # the no-NumPy path.

  distros:
    name: Build and test on ${{ matrix.image }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:testing
          - ubuntu:26.04
          - fedora:latest
          - registry.opensuse.org/opensuse/tumbleweed:latest
          - archlinux:latest
          - alpine:edge
    steps:
      - uses: actions/checkout@v7
      - run: echo "CASSINI_TEST_LOGS=$RUNNER_TEMP/meson-logs" >> "$GITHUB_ENV"
      # Retried once because distribution mirrors occasionally time out.
      - run: build-aux/check-distros.sh "${{ matrix.image }}" || build-aux/check-distros.sh "${{ matrix.image }}"
      # G3: the Meson test logs (testlog.txt with each shard's --durations,
      # testlog.json, the pytest junit XML), also on success, to track creep;
      # a shard over half its timeout becomes a warning annotation here.
      - name: Warn about pytest shards over half their budget
        if: always()
        run: grep -rhs '^::warning ' "$CASSINI_TEST_LOGS" --include=testlog.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: meson-logs-distro-${{ strategy.job-index }}
          path: ${{ runner.temp }}/meson-logs/
          retention-days: 14
          if-no-files-found: warn

