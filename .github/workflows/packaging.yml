name: Packaging checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
env:
  CONTAINER_ENGINE: docker
jobs:
  deb:
    name: Debian package
    uses: ./.github/workflows/deb.yml

  packages:
    name: RPM and Arch packages
    uses: ./.github/workflows/packages.yml

  flatpak:
    name: Flatpak
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Prepare the pinned host Trash portal in the SDK
        run: python3 tests/flatpak/prepare_trash_portal.py --output "$PWD/_ci-trash-portal"
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: cassini-talk-devel.flatpak
          manifest-path: build-aux/flatpak/io.codemyriad.CassiniTalk.Devel.json
          cache-key: flatpak-builder-${{ github.sha }}
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/parakeet-models
          key: parakeet-ultra-18cb623004dd6c15999b93cb70b14d8a1f6e8f3a2a97ff733f104bfc3494f6a9
      # The same offline check as the other packages: install the bundle and
      # write the D11 goldens down in a sandbox with --unshare=network.
      - name: Smoke-test the installed Flatpak offline
        env:
          CASSINI_PARAKEET_TEST_CACHE: ${{ runner.temp }}/parakeet-models
        run: build-aux/flatpak/smoke.sh cassini-talk-devel.flatpak io.codemyriad.CassiniTalk.Devel
      - name: Build the release identity for the installed ID-migration test
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --repo="$RUNNER_TEMP/talk-rebase-repo" "$RUNNER_TEMP/talk-rebase-build" \
            build-aux/flatpak/io.codemyriad.CassiniTalk.json
      - name: Fetch the immutable released 0.3.0 Flatpak
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const release = await github.rest.repos.getReleaseByTag({...context.repo, tag: 'v0.3.0'});
            const asset = release.data.assets.find(a => a.name === 'cassini-viewer.flatpak');
            if (!asset) throw new Error('Released 0.3.0 Flatpak is missing');
            const data = await github.rest.repos.getReleaseAsset({
              ...context.repo, asset_id: asset.id, headers: {accept: 'application/octet-stream'}
            });
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/cassini-viewer-0.3.0.flatpak`, Buffer.from(data.data));
      - name: Rebase the actual old Flatpak and preserve its private data
        env:
          CASSINI_QA_RENAME: '1'
        run: python3 tests/flatpak/rename.py "$RUNNER_TEMP/talk-rebase-repo" "$RUNNER_TEMP/cassini-viewer-0.3.0.flatpak" "$PWD/flatpak-rename.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flatpak-bridge-evidence
          path: |
            flatpak-companion-bridge.json
            flatpak-library-persistence.json
            flatpak-*-host.log
            flatpak-sandbox.log
            flatpak-trash.json
            flatpak-trash-portal.log
            flatpak-rename.json
          retention-days: 7
