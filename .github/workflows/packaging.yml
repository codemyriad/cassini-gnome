name: Packaging checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
env:
  CONTAINER_ENGINE: docker
jobs:
  deb:
    name: Debian package
    uses: ./.github/workflows/deb.yml

  packages:
    name: RPM and Arch packages
    uses: ./.github/workflows/packages.yml

  flatpak:
    name: Flatpak
    uses: ./.github/workflows/flatpak.yml
