name: Release preparation

# Dispatch it on a release branch to check its version metadata before
# tagging. Every PR runs the same check in Lint (source.yml, G16); the stable
# Flatpak is built, validated and smoke-tested in flatpak.yml and shipped
# through Flathub (D45.3), so nothing calls this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Version and release metadata
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check every package version and the proposed tag name without creating it
        run: |
          version=$(sed -n "s/^ *version: *'\([^']*\)'.*/\1/p" meson.build | head -n1)
          python3 build-aux/ci/release_metadata.py --tag "v$version" --report release-metadata.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: release-metadata.json
          if-no-files-found: error

