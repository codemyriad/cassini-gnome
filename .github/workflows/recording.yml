name: Recording integration

on:
  workflow_call:
    inputs:
      product:
        type: string
        default: ""
  workflow_dispatch:
permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: tests/recording/.node-version
      - name: Install audio and isolated GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-numpy python3-pytest python3-jsonschema python3-rfc3339-validator gir1.2-gstreamer-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good xvfb xauth xdotool dbus-x11 \
            gir1.2-gtk-4.0 gir1.2-adw-1 imagemagick pulseaudio-utils meson ninja-build gettext \
            libglib2.0-dev-bin libgtk-4-bin desktop-file-utils appstream at-spi2-core gir1.2-atspi-2.0 pipewire pipewire-pulse wireplumber
      - uses: actions/download-artifact@v8
        if: inputs.product != ''
        with:
          name: ${{ inputs.product }}
          path: _ci-download
      - name: Use exact default-profile build product
        if: inputs.product != ''
        run: |
          python3 build-aux/ci/product.py unpack _ci-core _ci-download/core.tar --commit "$GITHUB_SHA" --profile core
          echo "CASSINI_RECORDING_BUILD=$PWD/_ci-core/build" >> "$GITHUB_ENV"
      - name: Build default profile for standalone dispatch
        if: inputs.product == ''
        run: |
          meson setup _recording-build
          meson compile -C _recording-build
          echo "CASSINI_RECORDING_BUILD=$PWD/_recording-build" >> "$GITHUB_ENV"
      - run: python3 browser-protocol/verify.py --pinned browser-extension
      - run: npm ci --prefix tests/recording
      - run: tests/recording/node_modules/.bin/playwright install --with-deps chromium
      - run: /usr/bin/python3 -m pytest -q
      # The canonical test tree includes its adjacent conformance vectors.
      # verify.py above proves the installed extension is byte-identical.
      - run: node --test browser-protocol/extension/tests/*.test.cjs
      - run: node --test tests/recording/signal.test.mjs
      - name: Repeat native capture readiness in three fresh isolated containers
        run: |
          for attempt in 1 2 3; do
            printf 'Native readiness attempt %s/3\n' "$attempt"
            tests/recording/run.sh /usr/bin/python3 tests/recording/native.py
          done
      - name: Chromium WebRTC, lifecycle and tab capture through Native Messaging
        run: tests/recording/run.sh node tests/recording/browser.mjs
      - name: GTK recording and playback in a private display
        run: |
          tests/recording/run.sh /usr/bin/python3 tests/recording/gtk.py --build "$CASSINI_RECORDING_BUILD"
      - name: Recording page, keyboard notes, hidden controls and disk reserve
        run: tests/recording/run.sh /usr/bin/python3 tests/recording/comfort.py --build "$CASSINI_RECORDING_BUILD"
      - name: Library concurrent browser capture and native hidden controls
        run: CASSINI_TEST_BUILD="$CASSINI_RECORDING_BUILD" tests/recording/run.sh node tests/recording/app-control.mjs
      - name: Fresh Chromium companion installation and stable-folder update
        run: CASSINI_TEST_BUILD="$CASSINI_RECORDING_BUILD" tests/recording/run.sh node tests/recording/companion-install.mjs
      - name: Independent native microphone copies and per-session choice
        run: tests/recording/run.sh /usr/bin/python3 tests/recording/browser-microphone.py
      - name: Quit keeps audio when the microphone never delivers a frame
        run: tests/recording/run.sh /usr/bin/python3 tests/recording/no-frames.py --build "$CASSINI_RECORDING_BUILD"
      - name: Muted output is observed on the actual capture device
        run: tests/recording/run.sh /usr/bin/python3 tests/recording/output-muted.py
      - name: Source changes release devices and retain exact recording spans
        run: tests/recording/run.sh /usr/bin/python3 tests/recording/sources.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recording-evidence
          path: tests/recording/artifacts/
          retention-days: 7
