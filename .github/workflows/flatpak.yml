name: Flatpak
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
env:
  CONTAINER_ENGINE: docker
jobs:
  flatpak:
    name: Flatpak
    runs-on: ${{ vars.CM_RUNNER == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-26.04' }}
    timeout-minutes: 25
    container:
      # gnome-50 as of 2026-11-03 (multi-arch index, image created 2026-09-22).
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      # G4: /var/lib/flatpak gets an anonymous volume, which Docker fills
      # from the image's preinstalled SDK. The volume sits on the host
      # filesystem, not overlayfs, so ostree's renames during the SDK update
      # do not fail with EXDEV ("Invalid cross-device link") on the AWS
      # ubuntu-26.04 runner pool.
      options: --privileged -v /var/lib/flatpak
    steps:
      - uses: actions/checkout@v7
      # G4: update the system SDK on its own, before anything else, so an
      # infra failure is named as such instead of surfacing as xvfb-run exit
      # 139 inside the builder (whose --install-deps-from runs the same
      # `flatpak --system update`). Never retried: the EXDEV failure is
      # deterministic per runner pool. The first two checks fail if the volume
      # is missing or Docker did not fill it from the image, since every
      # later step needs the image's system SDK and flathub remote there.
      - name: Update the system GNOME 50 SDK (fails fast on infra errors)
        run: |
          grep -E '^([^ ]+ ){4}/var/lib/flatpak ' /proc/self/mountinfo || { echo '::error::infra: /var/lib/flatpak is not a separate mount; the container lost its -v /var/lib/flatpak volume'; exit 1; }
          { flatpak info --system org.gnome.Sdk//50 && flatpak info --system org.gnome.Platform//50; } >/dev/null || { echo '::error::infra: the /var/lib/flatpak volume was not filled from the image (no system GNOME 50 SDK)'; exit 1; }
          flatpak update --system -y --noninteractive org.gnome.Sdk//50 org.gnome.Platform//50 || { echo '::error::infra: Flatpak SDK update failed; "Invalid cross-device link" above is overlayfs EXDEV on this runner pool; rerun'; exit 1; }
      - name: Prepare the pinned host Trash portal in the SDK
        run: python3 tests/flatpak/prepare_trash_portal.py --output "$PWD/_ci-trash-portal"
      # Pinned (G4). flathub-infra/flatpak-github-actions has no tags and was
      # archived on 2025-04-24; this is the master SHA @master resolved to on
      # 2026-11-03 (last commit "Close this branch", README only).
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40 # master, 2026-11-03
        with:
          bundle: cassini-talk-devel.flatpak
          manifest-path: build-aux/flatpak/io.codemyriad.CassiniTalk.Devel.json
          # G8: keyed on the manifest, which pins every downloaded source, so
          # a run restores the last build of the same manifest (numpy and the
          # downloads; the app module is rebuilt from the checkout anyway).
          # The action saves only when nothing restored under this key, so
          # a pull request with main's manifest reuses main's entry and adds
          # none. Not `cache: false` on PRs: in this action that also turns
          # off the restore.
          cache-key: flatpak-builder-devel-${{ hashFiles('build-aux/flatpak/io.codemyriad.CassiniTalk.Devel.json') }}
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/parakeet-models
          key: parakeet-ultra-18cb623004dd6c15999b93cb70b14d8a1f6e8f3a2a97ff733f104bfc3494f6a9
      # The same offline check as the other packages: install the bundle and
      # write the D11 goldens down in a sandbox with --unshare=network.
      - name: Smoke-test the installed Flatpak offline
        env:
          CASSINI_PARAKEET_TEST_CACHE: ${{ runner.temp }}/parakeet-models
        run: build-aux/flatpak/smoke.sh cassini-talk-devel.flatpak io.codemyriad.CassiniTalk.Devel
      # Keep stable-profile build/install coverage; D51 removes only old-ID
      # rebase/migration work, not validation of the release package itself.
      # It builds against the system SDK the steps above already updated (G4
      # volume), instead of a second --user copy downloaded from Flathub.
      # smoke.sh still installs the bundle per-user, as for the devel bundle.
      # G15: a release ships this exact bundle (flatpak-stable, by run id).
      # It has no update remote (repo URL) until the D45.1 signed repository
      # is published: an origin that does not exist breaks `flatpak update`.
      # The tag workflow refuses a bundle without one
      # (build-aux/ci/flatpak_bundle.py), so no release ships this way.
      - name: Build, validate and freshly install the stable Cassini talk profile
        run: |
          flatpak-builder --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --repo="$RUNNER_TEMP/talk-stable-repo" "$RUNNER_TEMP/talk-stable-build" \
            build-aux/flatpak/io.codemyriad.CassiniTalk.json
          version=$(sed -n "s/^ *version: *'\([^']*\)'.*/\1/p" meson.build | head -n1)
          flatpak build --unshare=network --filesystem="$PWD:ro" "$RUNNER_TEMP/talk-stable-build" \
            python3 "$PWD/build-aux/ci/validate_installed.py" "$version" --prefix /app
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "$RUNNER_TEMP/talk-stable-repo" cassini-talk.flatpak io.codemyriad.CassiniTalk
          build-aux/flatpak/smoke.sh cassini-talk.flatpak io.codemyriad.CassiniTalk
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-stable
          path: cassini-talk.flatpak
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flatpak-bridge-evidence
          path: |
            flatpak-companion-bridge.json
            flatpak-library-persistence.json
            flatpak-*-host.log
            flatpak-sandbox.log
            flatpak-trash.json
            flatpak-trash-portal.log
          retention-days: 7
