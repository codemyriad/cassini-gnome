<!doctype html><html lang="en"><meta charset="utf-8"><title>Cassini deterministic meeting</title>
<button id="join">Join test meeting</button><audio id="remote" autoplay></audio>
<script>
window.meeting = {};
window.join = async (frequency) => {
  const context = new AudioContext({sampleRate: 48000});
  await context.resume();
  function tone(hz) {
    const oscillator = context.createOscillator(); oscillator.frequency.value = hz;
    const gain = context.createGain(); gain.gain.value = 0.2;
    const destination = context.createMediaStreamDestination();
    oscillator.connect(gain).connect(destination); oscillator.start();
    return {oscillator, destination, track: destination.stream.getAudioTracks()[0]};
  }
  const source = tone(frequency);
  const pc = new RTCPeerConnection({iceServers: []});
  const sender = pc.addTrack(source.track);
  pc.ontrack = event => {
    document.querySelector('audio').srcObject = new MediaStream([event.track]);
    document.querySelector('audio').play();
  };
  async function description() {
    if (pc.iceGatheringState !== 'complete') await new Promise(resolve => {
      pc.addEventListener('icegatheringstatechange', function check() {
        if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', check); resolve(); }
      });
    });
    return pc.localDescription.toJSON();
  }
  window.meeting = {context, pc, sender, source, tone, description,
    replace: async hz => { const next = tone(hz); await sender.replaceTrack(next.track); source.track.stop(); window.meeting.source = next; },
    mute: enabled => { sender.track.enabled = !enabled; }};
};
</script></html>
